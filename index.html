.s-tier { font-size: 12px; padding: 1px 10px; border-radius: 999px; background: var(--paper-2); color: var(--warm); white-space: nowrap; }
.s-red { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--wrong-soft); color: var(--wrong); white-space: nowrap; }
.s-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.s-stats > div { border-radius: 16px; padding: 10px 16px; display: flex; flex-direction: column; background: var(--paper-2); }
.s-stats .rem { background: var(--sage-soft); } .s-stats .vag { background: var(--gap-soft); } .s-stats .fgt { background: var(--wrong-soft); }

.s-stats small { color: var(--warm); }
.s-detail .d-word { font-size: clamp(24px, 3vw, 30px); }
.s-main { padding: 8px; }
.s-main > .rows { display: flex; flex-direction: column; gap: 8px; }
.s-main > .note-line { padding: 4px 8px 2px; }
@media (max-width: 640px) {
  .s-tl { grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
  .s-dot { width: 24px; height: 24px; font-size: 12px; }

  .s-card { padding: 10px 12px; }
  .s-main { padding: 4px; }

}
.s-tplan { border-top: 1px dashed #EFEBE3; padding: 6px 0 8px 36px; }
.s-tplan summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--sage-deep); padding: 4px 0; }
.s-tplan summary::-webkit-details-marker { display: none; }
.s-tplan-in { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }

/* ---------- 考前冲刺（sprint.js） ---------- */
.sp-banner { border-radius: 20px; background: var(--sage-soft); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }

<script>

/* 示例写作笔记：导入页“填入示例”用；测试台首次打开时作为“示例”笔记组载入
   每条下面缩进的“标签：内容”会整理进卡片的对应字段 */
const SAMPLE_NOTE = `# 强调深远影响
- have a profound impact on 对……产生深远影响
  - 例句：Social media has had a profound impact on the way young people communicate.
  - 搭配：have a profound / significant / lasting impact on sth
  - 场景：强调影响深远且持久，比 affect 更正式，适合主体段的结果句
  - 常见错误：impact 后用 on，不写 have a profound impact to
- exert a considerable influence on 对……施加相当大的影响（更正式）
  - 例句：Parents exert a considerable influence on their children's career choices.
  - 搭配：exert influence / pressure / control on sb
  - 场景：语气最正式，主语通常是人、机构或社会因素
  - 常见错误：influence 后用 on，不写 exert influence to
- play a pivotal role in 在……中起关键作用
  - 例句：Teachers play a pivotal role in shaping students' values.
  - 搭配：play a key / crucial / pivotal role in doing sth
  - 场景：强调“关键作用”而不是“影响”，in 后接名词或动名词
  - 常见错误：不写 play a pivotal role to do sth
- shape the way people think 塑造人们的思维方式
  - 例句：The internet has shaped the way people think about privacy.
  - 搭配：shape the way + 主语 + 动词
  - 场景：比 change 更具体，强调长期、逐渐的塑造
  - 常见错误：the way 后直接接句子，不写 the way how people think

# 表达原因的句型
- One reason for this is that ... 其中一个原因是……
  - 可替换：this 可换成具体现象；that 后接完整的原因句
  - 例句：One reason for this is that housing in big cities is expensive.
  - 场景：主体段列举多个原因时，引出其中一个
  - 常见错误：不写 One reason is because ...（reason 与 because 重复）
- This is largely due to the fact that ... 这在很大程度上是因为……
  - 可替换：largely 可换成 partly / mainly；that 后接完整句子
  - 例句：This is largely due to the fact that more people now work from home.
  - 场景：解释上一句现象的主要原因，语气正式
  - 常见错误：只接名词时用 due to + 名词，不加 the fact that

# 我的语法错误
- ❌ have a great influence to → ✅ have a great influence on 介词搭配：influence on
  - 规则：influence 作名词表示“对……的影响”时，介词用 on
  - 例句：Advertising has a great influence on what children want to buy.
  - 限制：influence 作动词时直接接宾语（influence sb），不加 on
- ❌ The number of cars are increasing. → ✅ The number of cars is increasing. 主语是 the number，谓语用单数
  - 规则：the number of + 复数名词作主语时，真正的主语是 number，谓语用单数
  - 例句：The number of international students has doubled since 2010.
  - 限制：a number of（许多）+ 复数名词，谓语用复数：A number of cars are parked outside.
- ❌ It can help people to know more knowledge. → ✅ It can help people gain more knowledge. know 不与 knowledge 搭配
  - 规则：knowledge 常与 gain / acquire / broaden 搭配
  - 例句：Travelling helps young people broaden their knowledge of other cultures.
  - 限制：learn 可接 skills / a language，一般不说 learn knowledge

# 零散积累
- a double-edged sword 一把双刃剑
  - 例句：Technology is a double-edged sword: it connects people but can also isolate them.
  - 搭配：prove to be / be a double-edged sword
  - 场景：开头段或让步段引出利弊讨论
  - 常见错误：同一篇文章里不要反复使用，避免显得套用模板
`;

/* ============================================================

const IMPORT_GUIDE = "# 导入规范（v9）\n\nv9 不带任何预设内容，表达库里的东西都由你自己导入。一共三种内容：**写作笔记**（表达卡、句型卡、语法卡）、**功能表达**、**主题表达**（话题，含话题词汇）。这份说明写清楚每一种要写什么、怎么写，照着写就能被准确认出来。\n\n## 一、怎么导入\n\n1. 用任何文字编辑器写（备忘录、Typora、Obsidian、记事本、Word 另存为纯文本都可以），保存成 **.md** 或 **.txt** 文件，编码用 **UTF-8**（大多数编辑器默认就是）。\n2. 在 App 里打开“主题表达”“功能表达”或“我的写作笔记”页右上角的“导入”，选“导入 .md / .txt 文件”；也可以直接把文字粘贴到输入框里。\n3. 点“整理”，先进**确认页**：每一条认成了什么、有没有问题都会列出来，可以直接改。确认后才进入学习。\n\n建议**每种内容一个文件**：`写作笔记.md`、`功能表达.md`、`主题表达.md`（可以按话题分成多个文件）。三种也可以写在同一个文件里，App 会分开认，确认页按三个标签分别确认。\n\n导入页、本页最上面可以下载三份**模板**（template-topics.md、template-functions.md、template-notes.md），模板本身就能直接导入成功，照着改最省事。\n\n## 二、通用写法（三种都一样）\n\n- **一行一条**：英文在前，中文在后，中间空一格。例：`have a profound impact on 对……产生深远影响`\n- **行首的 `- ` 或 `1.` 可写可不写**，缩进也可有可无，只是为了自己看着清楚。\n- **补充内容写在这一条的下一行**，格式 `标签：内容`。中文冒号“：”、英文冒号“:”都可以。写作笔记和功能表达里，同一个标签写两行会合在一起。\n- **标题用 `#`**，`#` 后面要空一格。全角的“＃”也能认。\n- **英文部分不要用中文标点**。App 从第一个中文字符或中文标点（，：；（）开始算中文，英文里夹了中文标点会被切开。英文里的括号、逗号请用半角。\n- **学习方式**：行末写【记忆】【资料】【暂缓】就按写的来；写在 `#` 标题后面，整组都按它；都不写就用“复习设置 → 导入时的默认学习方式”。\n  - 记忆：进新学和复习；资料：只查阅；暂缓：先放着。\n- **说明文字**：用 `\u003c!--` 和 `-->` 包起来的内容导入时会忽略（模板最上面的说明就是这样写的）。单独一行的 `---` 分隔线、加粗用的 `**` 也会忽略。\n- **重复导入不会重复**：同一类型、英文一样的卡，第二次导入会跳过，确认页会告诉你跳过了哪些。所以可以一直往同一个文件里加内容，每次整份重新导入。\n\n## 三、写作笔记\n\n### 三种卡怎么认\n\n| 卡片 | 怎么写 | App 怎么认 |\n|---|---|---|\n| 表达卡 | `英文 中文` | 普通的一行 |\n| 句型卡 | `句型 中文` | 英文里有 `...`、`…`、`sb`、`sth`、`___` 或 `[ ]` |\n| 语法卡 | `❌ 错误写法 → ✅ 正确写法 中文说明` | 有 ❌ / → / ✅；也可以写 `错误：… 正确：…` |\n\n认错了类型可以在确认页改（每行最前面的“表达 / 句型 / 语法”）。\n\n### 分组\n\n- `# 标题` 下面的卡是一组，组名就是标题，新学和复习都按组来。\n- 同一个标题下**至少 2 张同类卡**才成一组；只有 1 张的放进“独立卡片”。\n- 一个标题下混了几种卡，会按类型分成几组（同一个组名）。\n\n### 每种卡能写的标签\n\n| 卡片 | 必填 | 选填标签 |\n|---|---|---|\n| 表达卡 | 英文 + 中文 | 例句、搭配、场景、常见错误 |\n| 句型卡 | 句型 + 中文 | 例句、可替换、场景、常见错误 |\n| 语法卡 | 错误 → 正确 | 规则、例句、限制（中文说明写在正确写法后面） |\n\n```\n# 强调深远影响\n- have a profound impact on 对……产生深远影响\n  - 例句：Social media has had a profound impact on the way young people communicate.\n  - 搭配：have a profound / significant / lasting impact on sth\n  - 场景：强调影响深远且持久，适合主体段的结果句\n  - 常见错误：不写 have a profound impact to\n- play a pivotal role in 在……中起关键作用\n\n# 引出原因的句型\n- One reason for this is that ... 其中一个原因是……\n  - 可替换：this 可换成具体现象\n- This is largely due to the fact that ... 这在很大程度上是因为……\n\n# 我的语法错误\n- ❌ The number of cars are increasing. → ✅ The number of cars is increasing. 主语是 the number，谓语用单数\n  - 规则：the number of + 复数名词作主语时，谓语用单数\n  - 限制：a number of + 复数名词，谓语用复数\n```\n\n## 四、功能表达\n\n- 每个写作功能一个标题，**必须写成 `# 功能：功能名`**（例如 `# 功能：表达观点`）。没有“功能：”的标题会被当成写作笔记。\n- 标题下面一行一条：英文 + 中文。\n- 同名的功能再导入会并到一起，在功能表达页一起做近义比较。\n- 功能表达默认是“资料”；要背的条目在行末写【记忆】，整组都背就写在标题后面。\n\n| 必填 | 选填标签 |\n|---|---|\n| 英文 + 中文 | 后面接（句法结构）、语气、区别（进近义比较表）、例句、常见错误 |\n\n```\n# 功能：表达观点\n- I firmly believe that ... 我坚信……【记忆】\n  - 后面接：+ 完整句子\n  - 语气：立场鲜明，比较正式\n  - 区别：比 In my view 更坚定，全文只用一次\n  - 例句：I firmly believe that schools should teach practical life skills.\n  - 常见错误：不写 I firmly believe in that ...\n- From my perspective, ... 在我看来……\n```\n\n## 五、主题表达（话题）\n\n### 结构\n\n```\n# 话题：话题名\n大主题：工作\n关键概念：远程办公、通勤、工作效率\n\n## 立场：支持 | 这一边的核心想法\n### 论点：短名\n- 论点句英文 论点句中文\n- 解释：展开表达英文 中文\n- 结果：展开表达英文 中文\n- 举例：展开表达英文 中文\n范文：整段范文……\n\n### 论点：短名\n……\n\n## 立场：反对 | 另一边的核心想法\n### 论点：短名\n……\n\n## 话题词汇\n- 词汇英文 中文\n```\n\n- `# 话题：` 只能用**一个 #**；`## 立场：`、`### 论点：` 分别用两个、三个 #。\n- 立场名和核心想法之间用 `|` 隔开（也可以用全角空格或两个空格）。\n- 论点下面**第一行**是论点句；之后每条展开表达用这几个开头：**解释：结果：举例：原因：对比：让步：补充：影响：**\n- **范文**写在每个论点的最后，以 `范文：` 开头。可以写在同一行，也可以换行接着写；范文后面直到下一个 `###` 或 `##` 之前，不是 `- ` 开头的行都算范文。\n\n### 必须写的（少了不能导入）\n\n1. 新话题**至少 2 个立场**（选论点时要两边搭配）。\n2. 每个论点有**论点句**、**至少一条展开表达**、**范文**。\n3. 论点句和每条展开表达都要**原样出现在范文里**（不分大小写）。展开表达在范文里写法不一样（改了时态、单复数）时，在它下面加一行 `范文里写成：范文里的写法`。\n\n确认页会按行号告诉你哪里不满足，改完原文再导入。\n\n### 选填标签\n\n| 写在哪一行下面 | 标签 | 写法 |\n|---|---|---|\n| 话题（# 话题 下面） | 大主题 | 话题列表按大主题分组；不写放在“我导入的话题” |\n| | 关键概念 | 用顿号“、”隔开 |\n| 论点句 | 可替换 | 论点句里能换的位置，用 `/` 隔开 |\n| | 换个话题 | 把这个句式套到别的话题的一句 |\n| 展开表达 | 原形 | 词典里的原形，如 `spend time doing sth` |\n| | 引导句 | 范文里引出它的半句，如 `This is because they …` |\n| | 提醒 | 用法提醒 |\n| | 也可以说 | 同义替换，用 `/` 隔开 |\n| | 范文里写成 | 范文里的实际写法 |\n| | 搭配 | 常用搭配，可以写多行 |\n| | 拆分 | `词 词性 \\| 词 词性`，如 `spend 动词 \\| less time 名词短语` |\n| 话题词汇 | 范畴 | 如 伦理、问题、交通方式 |\n| | 词性 | 如 n. 不可数 |\n| | 例句 | `英文例句 / 中文翻译` |\n| | 动词搭配 | `英文 中文`，可以写多行 |\n| | 这样写 / 不这样写 | 用 `/` 隔开 |\n\n### 学习方式\n\n- 论点什么时候背，在 App 里“选论点”时决定，不用在文件里写。\n- 【记忆】【资料】【暂缓】只对话题词汇有用，不写就是“资料”（可在复习设置里改默认）。\n\n### 补充已有的话题\n\n同名话题再导入一次会**补进去**：新的论点接在后面；已有的论点（短名或论点句一样）和话题词汇跳过；学习进度不变。补充时不要求两个立场。\n\n## 六、导入以后\n\n- **确认页**：每条都能改文字、类型、分组、学习方式，也能删除；能先“看详情页”看导入后的样子，用“编辑”改每一块。没认出来的行在最上面，每行选“当成表达卡 / 当备注 / 不要”，都处理完才能确认。\n- **导入历史**（左侧“我的”下面）：每次导入留一条，点开能看到这次导入了什么。\n- **备份**：数据只存在这台设备的浏览器里。建议把 App 添加到主屏幕使用，并时常在“复习设置 → 数据”里导出备份。原始的 .md 文件也请自己留好。\n\n## 七、没认出来怎么办\n\n| 现象 | 原因 | 改法 |\n|---|---|---|\n| 一行变成“没认出来” | 这一行没有英文，或者标签名不在上面的表里 | 改成 `英文 中文`，或用表里的标签名 |\n| 中文跑到了英文里 / 英文被截断 | 英文部分用了中文标点 | 英文里的标点改成半角 |\n| 表达被认成句型卡 | 英文里有 `...` / `sb` / `sth` | 确认页把类型改回“表达” |\n| 功能表达被当成笔记 | 标题少了“功能：” | 标题写成 `# 功能：功能名` |\n| 论点句 / 展开表达“在范文里找不到” | 范文里的写法和这一行不完全一样 | 改成一样，或加 `范文里写成：` |\n| “新话题至少要两个立场” | 只写了一个 `## 立场：` | 补另一边的立场和论点 |\n| 补充标签挂错了地方 | 标签必须写在它所属那一行的**正下方** | 把标签行挪到对应的卡 / 表达下面 |\n\n## 附：全部标签速查\n\n| 用在 | 标签（括号里是也能认的别名） |\n|---|---|\n| 表达卡 / 句型卡 / 语法卡 | 例句（例子、示例、示例句、正确例句、example）、搭配（常用搭配）、场景（使用场景、适用场景、用法、使用提醒）、常见错误（易错、易错点、个人错误）、可替换（可替换位置、替换）、规则（语法规则）、限制（使用限制） |\n| 功能表达 | 后面接（句法、句法结构）、语气（语气和边界）、区别（近义区别）、例句、常见错误 |\n| 话题 | 大主题、关键概念 |\n| 论点句 | 可替换、换个话题 |\n| 展开表达开头 | 解释、结果、举例、原因、对比、让步、补充、影响 |\n| 展开表达下面 | 原形、引导句、提醒、也可以说、范文里写成、搭配、拆分 |\n| 话题词汇 | 范畴、词性、例句、动词搭配、这样写、不这样写 |\n| 学习方式 | 【记忆】【资料】【暂缓】（方括号 [记忆] 也可以） |\n";
const IMPORT_TPL = {"topic": "\u003c!--\n主题表达导入模板（v9）\n层级：# 话题 → ## 立场 → ### 论点 → 论点句、展开表达、范文；最后 ## 话题词汇。\n\n必须写的（少了不能导入，确认页会告诉你哪一行）：\n- 新话题至少 2 个立场（选论点时要两边搭配）。\n- 每个论点：论点下面第一行是论点句（英文 + 中文）；至少一条展开表达；一段范文。\n- 论点句、每条展开表达都要原样出现在范文里（不分大小写）。\n  展开表达在范文里写法不一样时（比如改了时态、复数），在它下面加一行“范文里写成：……”。\n\n展开表达用这几个开头：解释： 结果： 举例： 原因： 对比： 让步： 补充： 影响：\n\n选填标签（写在对应那一行的下面）：\n- 话题下面：大主题： 关键概念：（用顿号隔开）\n- 论点句下面：可替换：（论点句里能换的位置，用 / 隔开）  换个话题：（套到别的话题的一句）\n- 展开表达下面：原形： 引导句： 提醒： 也可以说：（用 / 隔开） 范文里写成： 搭配： 拆分：（词 词性 | 词 词性）\n- 话题词汇下面：范畴： 词性： 例句：（英文 / 中文） 动词搭配：（英文 中文） 这样写： 不这样写：（用 / 隔开）\n\n学习方式：论点什么时候背，在 App 里“选论点”时决定；【记忆】【资料】【暂缓】只对话题词汇有用，不写就是“资料”。\n同名话题再导入一次会补进去：新的论点接在后面，已有的论点、词汇跳过，学习进度不变。\n这种说明段落（注释）导入时会自动忽略。把下面的示例换成你自己的内容。\n-->\n\n# 话题：远程办公\n大主题：工作\n关键概念：远程办公、通勤、工作效率、团队合作\n\n## 立场：支持 | 远程办公对员工和城市都有好处\n\n### 论点：通勤\n- Working from home saves employees hours of commuting every week. 在家办公每周为员工节省好几个小时的通勤时间\n  - 可替换：Working from home / employees / commuting\n  - 换个话题：Online shopping saves consumers hours of travelling every month.\n- 解释：spend less time stuck in traffic 堵在路上的时间更少\n  - 原形：spend time doing sth\n  - 引导句：This is because they …\n  - 提醒：spend time 后面接 doing，不接 to do\n  - 也可以说：avoid the daily rush hour / skip the long journey to work\n  - 搭配：spend time / money / energy doing sth\n  - 拆分：spend 动词 | less time 名词短语 | stuck in traffic 被困在车流里\n- 结果：achieve a better work-life balance 实现更好的工作与生活平衡\n- 举例：parents with young children 带小孩的父母\n范文：Working from home saves employees hours of commuting every week. This is because they spend less time stuck in traffic and more time on meaningful tasks. As a result, many of them achieve a better work-life balance. For example, parents with young children can take their children to school and still start work on time.\n\n### 论点：效率\n- Many employees are more productive in a quiet home environment. 很多员工在安静的家里效率更高\n- 解释：fewer interruptions from colleagues 来自同事的打扰更少\n- 结果：complete tasks efficiently 高效地完成任务\n  - 范文里写成：complete tasks more efficiently\n范文：Many employees are more productive in a quiet home environment. They face fewer interruptions from colleagues, so they can focus on difficult work for longer. Consequently, they often complete tasks more efficiently than they would in a busy office.\n\n## 立场：反对 | 远程办公会削弱团队合作和员工的归属感\n\n### 论点：沟通\n- Remote work can weaken communication within a team. 远程办公会削弱团队内部的沟通\n- 解释：lack face-to-face contact 缺少面对面的交流\n- 结果：lead to misunderstandings 导致误解\n- 举例：new employees 新员工\n范文：Remote work can weaken communication within a team. When colleagues lack face-to-face contact, small problems are not discussed in time. This can easily lead to misunderstandings and delays. For example, new employees may find it hard to ask questions and learn from experienced staff.\n\n### 论点：孤独\n- Working alone at home can make people feel isolated. 一个人在家工作会让人感到孤立\n- 解释：miss out on social interaction 错过与人交往的机会\n- 结果：harm their mental health 损害心理健康\n范文：Working alone at home can make people feel isolated. Without an office, they miss out on social interaction with their colleagues. Over time, this may harm their mental health and reduce their motivation.\n\n## 话题词汇\n- remote work 远程办公【记忆】\n  - 范畴：工作方式\n  - 词性：n. 不可数\n  - 例句：Remote work has become common since 2020. / 2020 年以来远程办公变得很普遍。\n  - 动词搭配：switch to remote work 改为远程办公\n  - 这样写：remote work / working from home\n  - 不这样写：remote works\n- work-life balance 工作与生活的平衡\n  - 范畴：生活质量\n  - 词性：n.\n  - 例句：Flexible hours help employees achieve a better work-life balance.\n- productivity 生产效率\n  - 范畴：工作表现\n  - 词性：n. 不可数\n", "fn": "\u003c!--\n功能表达导入模板（v9）\n- 每个写作功能一个标题，必须写成“# 功能：功能名”，例如 # 功能：表达观点。\n  同名的功能再导入会并到一起，在功能表达页里一起做近义比较。\n- 标题下面一行一条：英文在前，中文在后，中间空一格。\n- 补充内容写在下一行“标签：内容”：\n    后面接：句法结构（+ 完整句子 / + 名词）\n    语气：正式程度、立场强弱\n    区别：和同功能其他表达有什么不同（会出现在近义比较表里）\n    例句：一句完整的例句\n    常见错误：容易写错的地方\n- 功能表达默认是“资料”（只查阅，不进新学和复习）；要背的条目在行末写【记忆】，整组都背就写在标题后面。\n- 这种说明段落（注释）导入时会自动忽略。把下面的示例换成你自己的内容。\n-->\n\n# 功能：表达观点\n- I firmly believe that ... 我坚信……【记忆】\n  - 后面接：+ 完整句子\n  - 语气：立场鲜明，比较正式\n  - 区别：比 In my view 更坚定，全文只用一次\n  - 例句：I firmly believe that schools should teach practical life skills.\n  - 常见错误：不写 I firmly believe in that ...\n- From my perspective, ... 在我看来……\n  - 后面接：+ 完整句子\n  - 语气：中性，稍微客观一些\n  - 区别：比 I think 正式，适合开头段\n  - 例句：From my perspective, the benefits of online learning outweigh its drawbacks.\n\n# 功能：原因与解释\n- Owing to the fact that ... 由于……\n  - 后面接：+ 完整句子\n  - 语气：正式\n  - 区别：比 because 正式，句子较长时用\n  - 例句：Owing to the fact that housing is expensive, many young people choose to rent.\n- The root cause of this is ... 根本原因是……\n  - 后面接：+ 名词 / that 从句\n  - 区别：强调最深层的那个原因\n  - 例句：The root cause of this is a lack of affordable housing.\n", "notes": "\u003c!--\n写作笔记导入模板（v9）\n- 一行一张卡：英文在前，中文在后，中间空一格。行首的“- ”可写可不写。\n- 卡的类型自动认：\n    表达卡：普通英文 + 中文\n    句型卡：英文里有 ... 或 … 或 sb / sth（例：One reason for this is that ...）\n    语法卡：❌ 错误写法 → ✅ 正确写法 中文说明\n- 补充内容写在卡的下一行，格式“标签：内容”（前面缩进两格，中英文冒号都可以）。\n- “# 标题”下面的卡是一组；同一个标题下至少 2 张同类卡才成一组，只有 1 张的会单独放。\n- 学习方式：行末写【记忆】【资料】【暂缓】；写在标题后面整组都按它；不写按“复习设置”里的默认值。\n- 这种说明段落（注释）导入时会自动忽略，可以删掉，也可以留着。\n- 把下面的示例换成你自己的内容。\n-->\n\n# 强调深远影响\n- have a profound impact on 对……产生深远影响\n  - 例句：Social media has had a profound impact on the way young people communicate.\n  - 搭配：have a profound / significant / lasting impact on sth\n  - 场景：强调影响深远且持久，比 affect 更正式，适合主体段的结果句\n  - 常见错误：impact 后用 on，不写 have a profound impact to\n- play a pivotal role in 在……中起关键作用\n  - 例句：Teachers play a pivotal role in shaping students' values.\n  - 搭配：play a key / crucial / pivotal role in doing sth\n  - 场景：强调“关键作用”，in 后面接名词或动名词\n\n\u003c!-- 句型卡：英文里有 ... 就是句型卡。可以多写一个“可替换：”，说明哪些位置能换 -->\n# 引出原因的句型\n- One reason for this is that ... 其中一个原因是……\n  - 可替换：this 可换成具体现象；that 后面接完整的原因句\n  - 例句：One reason for this is that housing in big cities is expensive.\n  - 场景：主体段列举多个原因时，引出其中一个\n  - 常见错误：不写 One reason is because ...\n- This is largely due to the fact that ... 这在很大程度上是因为……\n  - 可替换：largely 可换成 partly / mainly\n  - 例句：This is largely due to the fact that more people now work from home.\n\n\u003c!-- 语法卡：❌ 错 → ✅ 对，后面跟中文说明。补充用“规则：”“例句：”“限制：” -->\n# 我的语法错误\n- ❌ The number of cars are increasing. → ✅ The number of cars is increasing. 主语是 the number，谓语用单数\n  - 规则：the number of + 复数名词作主语时，真正的主语是 number，谓语用单数\n  - 例句：The number of international students has doubled since 2010.\n  - 限制：a number of（许多）+ 复数名词，谓语用复数\n- ❌ have a great influence to → ✅ have a great influence on 介词用 on\n  - 规则：influence 作名词表示“对……的影响”时，介词用 on\n\n\u003c!-- 整组设成“资料”：标签写在标题后面 -->\n# 零散积累【资料】\n- a double-edged sword 一把双刃剑\n  - 例句：Technology is a double-edged sword.\n- strike a balance between A and B 在 A 和 B 之间取得平衡【记忆】\n"};

const SNAP_INDEX = DATA_KEY + '.snaps', SNAP_DAY = DATA_KEY + '.snapday';

const snapOff = () => !!(window.__ARCHIVE || window.__DEMO);

  let l = snapList();

  try { if (l.length && l[0].len === raw.length && localStorage.getItem(l[0].key) === raw) return l[0]; } catch (e) {}

  const cnt = { daily: 0, other: 0 }; let total = 0;

const TYPE_LABEL = { core: '核心论点', know: '知识表达', term: '专业词汇', fn: '功能表达', expr: '表达卡', pattern: '句型卡', grammar: '语法卡' };
const PROMPT_LABEL = { core: '中文观点 → 完整英文句子', know: '中文含义 / 句子填空 → 短语', term: '中文场景 → 术语和搭配', fn: '写作功能 → 表达', expr: '中文提示 → 英文写出', pattern: '结构提示 → 写出句型', grammar: '错误句 → 改正' };
const KIND_LABEL = { expr: '表达组', pattern: '句型组', grammar: '语法组' };
const STATUS_CLS = { '待整理': 's-triage', '等待学习': 's-wait', '学习中': 's-learn', '初次完成': 's-first', '待复习': 's-due', '近期稳定': 's-stable', '资料': 's-ref', '暂缓': 's-ref' };
const LADDER = [1, 3, 7, 14, 30];

let ITEMS = new Map(), GROUPS = new Map();
function assemble() {
  ITEMS = new Map(); GROUPS = new Map();
  // v9：v4 的旧版主题表达组已经移除，主题表达只用新结构（t3.js）
  for (const g of FUNCTION_GROUPS) {
    const G = { id: g.id, lib: 'function', fn: g.fn, name: g.fn, scene: g.scene, ids: [] };
    GROUPS.set(G.id, G);
    for (const [en, zh, syntax, tone, diffNote, ex, err] of g.items) {
      const id = 'f:' + slug(en);
      ITEMS.set(id, { id, lib: 'function', type: 'fn', gid: g.id, en, zh, syntax, tone, diff: diffNote, ex, err, src: '系统预设 · 功能表达', builtin: true });
      G.ids.push(id);
    }
  }
  for (const g of S.custom.groups) GROUPS.set(g.id, Object.assign({}, g, { ids: [] }));
  for (const it of S.custom.items) {
    const G = GROUPS.get(it.gid); if (!G) continue;
    ITEMS.set(it.id, Object.assign({}, it, { custom: true })); G.ids.push(it.id);
  }
  for (const g of S.notes.groups) GROUPS.set(g.id, Object.assign({}, g, g.kind === 'fn' ? { lib: 'function', fn: g.name, scene: '' } : { lib: 'notes' }, { ids: [] }));
  for (const it of S.notes.items) {
    const G = GROUPS.get(it.gid); if (!G) continue;
    ITEMS.set(it.id, Object.assign({}, it, { lib: it.type === 'fn' ? 'function' : 'notes' })); G.ids.push(it.id);
  }
  applyFnOver();
}

function noteSet(id) { return S.notes.sets.find(s => s.id === id); }
// 只有功能表达的那次导入算在功能表达里，不出现在“我的写作笔记”
// 有内容的写作功能（自带的 + 导入时新建的）
const fnGroupCount = () => [...GROUPS.values()].filter(G => G.lib === 'function' && !G.independent && G.ids.length).length;
const isNoteSet = set => { const its = S.notes.items.filter(i => i.setId === set.id); return !its.length || its.some(i => i.type !== 'fn'); };
function defMode(it) { if (!it) return 'reference'; if (it.defMode) return it.defMode; if (it.type === 'fn') return setDefMode('fn'); return it.type === 'core' ? 'memory' : 'reference'; }
function st(id) { return S.items[id] || (S.items[id] = { hist: [], wrong: 0 }); }
function modeOf(id) { const s = S.items[id]; return (s && s.mode) || defMode(ITEMS.get(id)); }
function studied(id) { const s = S.items[id]; return !!(s && s.stage != null); }
function confirmedItem(it) { if (!it) return false; if (!it.setId) return true; const set = noteSet(it.setId); return !set || set.confirmed; }
function active(id) { return confirmedItem(ITEMS.get(id)); }
function isDue(id) { const s = S.items[id]; return active(id) && modeOf(id) === 'memory' && studied(id) && s.next <= dayStart(); }

function itemStatus(id) {
  const it = ITEMS.get(id);
  if (!confirmedItem(it)) return '待整理';
  const m = modeOf(id);
  if (m === 'reference') return '资料';
  if (m === 'paused') return '暂缓';
  const s = S.items[id];
  if (!s || s.stage == null) return S.newSession && S.newSession.ids.includes(id) ? '学习中' : '等待学习';
  if (s.next <= dayStart()) return '待复习';
  const reviews = s.hist.filter(h => h.p !== 'new');
  if (!reviews.length) return '初次完成';
  const last2 = reviews.slice(-2);
  if (s.stage >= 3 && last2.length === 2 && last2.every(h => h.r === 'rem')) return '近期稳定';
  return '学习中';
}
const statusHTML = label => `<span class="status ${STATUS_CLS[label] || ''}">${label}</span>`;

function gstats(G) {
  const r = { total: 0, mem: 0, ref: 0, paused: 0, fresh: 0, due: 0, stable: 0, first: 0, studied: 0, last: 0, next: Infinity };
  for (const id of G.ids) {
    if (!active(id)) continue;
    r.total++;
    const m = modeOf(id);
    if (m === 'reference') { r.ref++; continue; }
    if (m === 'paused') { r.paused++; continue; }
    r.mem++;
    if (!studied(id)) { r.fresh++; continue; }
    r.studied++;
    const s = S.items[id];
    r.last = Math.max(r.last, s.last || 0);
    r.next = Math.min(r.next, s.next);
    const lab = itemStatus(id);
    if (lab === '待复习') r.due++;
    if (lab === '近期稳定') r.stable++;
    if (lab === '初次完成') r.first++;
  }
  if (G.lib === 'notes') { const set = noteSet(G.setId); if (set && !set.confirmed) { r.status = '待整理'; return r; } }
  if (r.due) r.status = '待复习';
  else if (!r.mem) r.status = '资料';
  else if (r.fresh === r.mem) r.status = '等待学习';
  else if (r.fresh) r.status = '学习中';
  else if (r.stable === r.mem) r.status = '近期稳定';
  else if (r.first === r.mem) r.status = '初次完成';
  else r.status = '学习中';
  return r;
}

function groupCrumb(G) {
  if (G.lib === 'topic') return [G.topic, G.sub];
  if (G.lib === 'function') return ['功能表达', G.fn];
  const set = noteSet(G.setId);
  return ['我的写作笔记', set ? set.title : ''];
}
function typeTag(type) { return `<span class="tag ${type}">${TYPE_LABEL[type] || ''}</span>`; }

/* ============================================================
   间隔复习
   ============================================================ */
function bumpLog(field, n = 1) { const k = dayKey(); const l = S.log[k] || (S.log[k] = {}); l[field] = (l[field] || 0) + n; }
function markLearned(id, firstOk) {
  const s = st(id);
  s.stage = 0; s.next = addDays(Date.now(), LADDER[0]); s.last = Date.now();
  s.hist.push({ r: firstOk ? 'rem' : 'fgt', t: Date.now(), p: 'new' });
  if (!firstOk) s.wrong = (s.wrong || 0) + 1;
  bumpLog('learned');
}
function nextIntervalLabel(id, r) {
  const s = S.items[id] || { stage: 0 };
  if (r === 'rem') return '约 ' + LADDER[Math.min((s.stage || 0) + 1, LADDER.length - 1)] + ' 天后';
  if (r === 'vag') return ((s.stage || 0) >= 2 ? 2 : 1) + ' 天后再现';
  return '明天优先复习';
}
function applyRating(id, r, prompt) {
  const s = st(id), now = Date.now();
  if (r === 'rem') { s.stage = Math.min((s.stage || 0) + 1, LADDER.length - 1); s.next = addDays(now, LADDER[s.stage]); }
  else if (r === 'vag') { const d = (s.stage || 0) >= 2 ? 2 : 1; s.stage = Math.max(0, (s.stage || 0) - 1); s.next = addDays(now, d); }
  else { s.stage = 0; s.next = addDays(now, 1); s.wrong = (s.wrong || 0) + 1; }
  s.last = now;
  s.hist.push({ r, t: now, p: prompt });
  bumpLog(r);
}
function dueQueue() {
  const map = new Map();
  for (const [id, it] of ITEMS) {
    if (!isDue(id) || it.lib !== 'topic') continue; // 功能表达、写作笔记归“配菜复习”（side.js）
    if (!map.has(it.gid)) map.set(it.gid, []);
    map.get(it.gid).push(id);
  }
  const arr = [];
  for (const [gid, ids] of map) {
    if (!GROUPS.has(gid)) continue;
    ids.sort((a, b) => (S.items[b].wrong || 0) - (S.items[a].wrong || 0) || S.items[a].next - S.items[b].next);
    arr.push({ gid, ids, minNext: Math.min(...ids.map(i => S.items[i].next)), wrong: ids.reduce((a, i) => a + (S.items[i].wrong || 0), 0) });
  }
  arr.sort((a, b) => a.minNext - b.minNext || b.wrong - a.wrong);
  return arr;
}
const dueCount = () => dueQueue().reduce((a, g) => a + g.ids.length, 0) + t3DueCount() + sdDue().length;
function todayLog() { return S.log[dayKey()] || {}; }
function canCheckin() {
  const l = todayLog();
  const did = (l.rem || 0) + (l.vag || 0) + (l.fgt || 0) + (l.learned || 0);
  return !l.checked && did > 0 && dueCount() === 0 && !t3Pend().length;
}
function checkin() {
  const k = dayKey(); const l = S.log[k] || (S.log[k] = {});
  l.checked = true; l.checkedAt = Date.now(); save();
  toast('已打卡，写入 ' + fmtMD(Date.now()) + ' 的学习记录');
}
function streak() {
  let n = 0, t = Date.now();
  if (!(S.log[dayKey(t)] || {}).checked) t = addDays(t, -1);
  while ((S.log[dayKey(t)] || {}).checked) { n++; t = addDays(t, -1); }
  return n;
}

/* ============================================================
   默写判定：在用户答案里标出错误 / 缺失 / 多余
   ============================================================ */
function tok(s) {
  return String(s || '').replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').trim().split(/\s+/).filter(Boolean)
    .map(raw => ({ raw, n: raw.toLowerCase().replace(/[^a-z0-9'\-]/g, '').replace(/^['-]+|['-]+$/g, '') }));
}
function diff(user, correct) {
  const Ua = tok(user), Ca = tok(correct);
  const U = Ua.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const C = Ca.map((t, i) => Object.assign({ i }, t)).filter(t => t.n);
  const m = U.length, n = C.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = U[i].n === C[j].n ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && U[i].n === C[j].n) { ops.push({ t: 'eq', u: U[i], c: C[j] }); i++; j++; }
    else if (j < n && (i === m || dp[i][j + 1] >= dp[i + 1][j])) { ops.push({ t: 'del', c: C[j] }); j++; }
    else { ops.push({ t: 'ins', u: U[i] }); i++; }
  }
  const uCls = new Array(Ua.length).fill(''), cCls = new Array(Ca.length).fill(''), miss = {};
  let k = 0, eq = 0;
  while (k < ops.length) {
    if (ops[k].t === 'eq') { eq++; k++; continue; }
    const ins = [], del = [];
    while (k < ops.length && ops[k].t !== 'eq') { (ops[k].t === 'ins' ? ins : del).push(ops[k]); k++; }
    del.forEach(o => { cCls[o.c.i] = 'tk-need'; });
    if (ins.length && del.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-wrong'; });
      if (del.length > ins.length) { const p = ins[ins.length - 1].u.i + 1; miss[p] = (miss[p] || 0) + del.length - ins.length; }
    } else if (ins.length) {
      ins.forEach(o => { uCls[o.u.i] = 'tk-extra'; });
    } else {
      const p = k < ops.length ? ops[k].u.i : Ua.length;
      miss[p] = (miss[p] || 0) + del.length;
    }
  }
  const missTag = c => `<span class="tk-miss" title="这里缺少 ${c} 个词">缺${c > 1 ? c : ''}</span>`;
  let userHTML = '';
  for (let x = 0; x <= Ua.length; x++) {
    if (miss[x]) userHTML += missTag(miss[x]) + ' ';
    if (x < Ua.length) userHTML += (uCls[x] ? `<span class="${uCls[x]}">${esc(Ua[x].raw)}</span>` : esc(Ua[x].raw)) + ' ';
  }
  const correctHTML = Ca.map((t, x) => cCls[x] ? `<span class="${cCls[x]}">${esc(t.raw)}</span>` : esc(t.raw)).join(' ');
  return { ok: m > 0 && ops.every(o => o.t === 'eq'), empty: m === 0, score: n ? eq / n : 0, userHTML: userHTML.trim(), correctHTML };
}

/* ============================================================
   笔记解析：粘贴文字 / Markdown → 表达卡、句型卡、语法卡
   ============================================================ */
const CJK = /[㐀-鿿　-〿（：，；]/;
function stripTail(s) { return String(s).trim().replace(/[\s\-–—:：|=,，;；]+$/, '').trim(); }
function splitEnZh(s) {
  const i = s.search(CJK);
  if (i < 0) return { en: stripTail(s), zh: '' };
  return { en: stripTail(s.slice(0, i)), zh: s.slice(i).trim() };
}
const isPattern = en => /\.\.\.|…|_{2,}|\bsb\b|\bsth\b|\[[^\]]+\]/i.test(en);
/* 卡片专属字段：导入时写在一条下面的“标签：内容” */
const NOTE_FIELDS = [
  ['ex', /^(?:例句|例子|示例|示例句|正确例句|example)$/i],
  ['col', /^(?:搭配|常用搭配|collocations?)$/i],
  ['usage', /^(?:场景|使用场景|适用场景|用法|使用提醒|usage)$/i],
  ['err', /^(?:常见错误|易错|易错点|个人错误)$/],
  ['slots', /^(?:可替换|可替换位置|替换)$/],
  ['rule', /^(?:规则|语法规则|rule)$/i],
  ['limit', /^(?:限制|使用限制)$/],
  ['syntax', /^(?:后面接|句法|句法结构)$/],
  ['tone', /^(?:语气|语气和边界)$/],
  ['diff', /^(?:区别|近义区别)$/],
];
/* 学习方式标记：写在行末或标题后面 */
const MODE_TAG = /\s*[【\[]\s*(记忆|资料|暂缓)\s*[】\]]\s*/;
const MODE_OF_TAG = { 记忆: 'memory', 资料: 'reference', 暂缓: 'paused' };
function takeMode(line) { const m = line.match(MODE_TAG); return m ? { line: line.replace(MODE_TAG, ' ').trim(), mode: MODE_OF_TAG[m[1]] } : { line, mode: null }; }
/* 设置里的默认学习方式（第 42 节）；S.t3 还没建好时用默认值 */
const DEF_MODE = { expr: 'memory', pattern: 'memory', grammar: 'memory', fn: 'reference', term: 'reference' };
function setDefMode(kind) { const d = S.t3 && S.t3.set && S.t3.set.defMode; return (d && d[kind]) || DEF_MODE[kind]; }
function fieldLine(line) {
  const m = line.match(/^([^:：\s]{1,8})\s*[:：]\s*(.+)$/);
  if (!m) return null;
  const f = NOTE_FIELDS.find(([, re]) => re.test(m[1].trim()));
  return f ? { key: f[0], val: m[2].trim() } : null;
}
/* 导入前先清理（行号不变）：去掉 BOM、<!-- 注释 -->、分隔线 ---、加粗的 **；全角 ＃ 当作 # */
function cleanImportText(text) {
  return String(text || '').replace(/^\uFEFF/, '').replace(/\r/g, '')
    .replace(/<!--[\s\S]*?(?:-->|$)/g, m => m.replace(/[^\n]/g, ''))
    .replace(/^([ \t]*)(＃+)/gm, (m, sp, h) => sp + '#'.repeat(h.length))
    .replace(/^[ \t]*([-*_])(?:[ \t]*\1){2,}[ \t]*$/gm, '')
    .replace(/\*\*/g, '');
}
function parseNotes(text) {
  const lines = cleanImportText(text).split('\n');
  const secs = []; let cur = { heading: '', cards: [] }; secs.push(cur);
  const unrec = [];
  const wrongMark = /^(?:❌|✗|✘|×|错误\s*[:：]|wrong\s*[:：])\s*/i;
  const arrow = /\s*(?:→|->|=>|⇒)\s*|\s*(?:✅|✓|✔|√|正确\s*[:：])\s*/;
  lines.forEach((rawLine, idx) => {
    let line = rawLine.trim();
    if (!line) return;
    const h = line.match(/^#{1,6}\s+(.+)$/);
    if (h) {
      const t = takeMode(h[1].trim()), fn = t.line.match(/^功能\s*[:：]\s*(.+)$/);
      cur = { heading: fn ? fn[1].trim() : t.line, fn: !!fn, mode: t.mode, cards: [] }; secs.push(cur); return;
    }
    line = line.replace(/^>\s*/, '').replace(/^(?:[-*+•·]|\d+[.)、])\s+/, '').replace(/^\[[ xX]\]\s+/, '').trim();
    if (!line) return;
    const tm = takeMode(line); line = tm.line;
    const fl = fieldLine(line);
    const last = cur.cards[cur.cards.length - 1];
    if (fl && last) { last.fields = last.fields || {}; last.fields[fl.key] = last.fields[fl.key] ? last.fields[fl.key] + '；' + fl.val : fl.val; return; }
    let card = null;
    const parts = line.replace(wrongMark, '').split(arrow).filter(x => x && x.trim());
    if (!cur.fn && (wrongMark.test(line) || (parts.length >= 2 && /[A-Za-z]/.test(parts[0]) && !CJK.test(parts[0])))) {
      if (parts.length >= 2) {
        let { en, zh } = splitEnZh(parts.slice(1).join(' '));
        // 中文解释以英文单词开头时（know 不与 knowledge 搭配），句号后面的几个词归到解释里
        const m = zh && en.match(/^(.*[.!?])\s+(\S+(?:\s+\S+){0,2})$/);
        if (m) { en = m[1]; zh = m[2] + ' ' + zh; }
        if (en) card = { kind: 'grammar', wrong: stripTail(parts[0]), en, zh };
      }
    } else {
      const { en, zh } = splitEnZh(line);
      if (en && /[A-Za-z]/.test(en)) card = { kind: cur.fn ? 'fn' : isPattern(en) ? 'pattern' : 'expr', en, zh };
    }
    if (card) { card.raw = rawLine.trim(); card.line = idx + 1; card.mode = tm.mode; cur.cards.push(card); }
    else unrec.push({ line: idx + 1, text: rawLine.trim() });
  });
  const out = secs.filter(s => s.cards.length);
  out.unrec = unrec;
  return out;
}
function addNoteItem(c, setId, gid, secMode) {
  const def = c.mode || secMode || setDefMode(c.kind);
  const f = c.fields || {};
  // 句型卡的“场景”存为适用场景
  if (c.kind === 'pattern' && f.usage && !f.scene) { f.scene = f.usage; delete f.usage; }
  const it = Object.assign({ id: 'n:' + uid(), setId, gid, type: c.kind, en: c.en, zh: c.zh, wrong: c.wrong || '', usage: '', err: '', raw: c.raw, line: c.line, defMode: def }, f);
  S.notes.items.push(it);
  return it;
}
/* 导入的功能表达并进 App 自带的同名功能；没有就新建一个功能组 */
function fnGroupFor(name, setId) {
  const g = FUNCTION_GROUPS.find(x => x.fn === name);
  if (g) return g.id;
  const old = S.notes.groups.find(x => x.kind === 'fn' && x.name === name);
  if (old) return old.id;
  const id = 'nf:' + uid();
  S.notes.groups.push({ id, setId, kind: 'fn', name });
  return id;
}
function createNoteSet(text, title, opts = {}) {
  const secs = opts.secs || parseNotes(text);
  const setId = 'ns:' + uid();
  let count = 0;
  // 已经有的卡（同一类型、同样的英文）跳过：同一份笔记补了内容再导入一次，不会重复
  const norm = x => String(x || '').toLowerCase().replace(/\s+/g, ' ').trim();
  // 测试台预先放进去的示例笔记不算（测试台验收导入时还要再导入一次示例）
  const demo = new Set(S.notes.sets.filter(x => x.source === '示例笔记，可删除').map(x => x.id));
  const have = new Set(S.notes.items.filter(i => !demo.has(i.setId)).map(i => i.type + '|' + norm(i.en)));
  if (typeof ITEMS !== 'undefined') for (const it of ITEMS.values()) if (it.type === 'fn') have.add('fn|' + norm(it.en));
  const skipped = [];
  for (const sec of secs) sec.cards = sec.cards.filter(c => {
    const k = c.kind + '|' + norm(c.en);
    if (have.has(k)) { skipped.push({ line: c.line, en: c.en }); return false; }
    have.add(k); return true;
  });
  createNoteSet.skipped = skipped.length;
  for (const sec of secs) {
    if (sec.fn) {
      if (!sec.cards.length) continue;
      const gid = fnGroupFor(sec.heading, setId);
      sec.cards.forEach(c => addNoteItem(c, setId, gid, sec.mode));
      count += sec.cards.length;
      continue;
    }
    for (const kind of ['expr', 'pattern', 'grammar']) {
      const cards = sec.cards.filter(c => c.kind === kind);
      if (!cards.length) continue;
      if (sec.heading && cards.length >= 2) {
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId, kind, name: sec.heading });
        cards.forEach(c => addNoteItem(c, setId, gid, sec.mode));
      } else {
        cards.forEach(c => { const gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId, kind, name: c.en }); addNoteItem(c, setId, gid, sec.mode); });
      }
      count += cards.length;
    }
  }
  const unrec = (secs.unrec || []).slice();
  if (!count && !unrec.length) return null;
  S.notes.sets.push({ id: setId, title, created: Date.now(), confirmed: !!opts.confirmed, source: opts.source || '粘贴的文字', unrec, skipped });

function markText(text, specs) {
  const lower = String(text || '').toLowerCase(), ranges = [];
  for (const sp of specs) {
    if (!sp.p) continue;
    const i = lower.indexOf(sp.p.toLowerCase());
    if (i < 0 || ranges.some(r => i < r.e && i + sp.p.length > r.s)) continue;
    ranges.push({ s: i, e: i + sp.p.length, cls: sp.cls || '' });
  }
  ranges.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  for (const r of ranges) { out += esc(text.slice(pos, r.s)) + `<mark class="${r.cls}">` + esc(text.slice(r.s, r.e)) + '</mark>'; pos = r.e; }
  return out + esc(String(text || '').slice(pos));
}

function blankIn(sentence, phrase) {
  const i = sentence.toLowerCase().indexOf(phrase.toLowerCase());
  if (i < 0) return null;
  return esc(sentence.slice(0, i)) + '<span class="blank"></span>' + esc(sentence.slice(i + phrase.length));
}

        return `<div class="citem"><button class="check" type="button" role="checkbox" aria-checked="${m === 'memory'}" data-a="mem" data-id="${esc(id)}" aria-label="加入记忆：${esc(it.en)}">${svg('check', 2.6)}</button>
          <div class="body" role="button" data-go="item:${esc(id)}" style="cursor:pointer"><span class="en">${esc(it.en)}</span><span class="zh">${esc(it.zh)}</span></div>${typeTag(it.type)}${studied(id) || m !== 'memory' ? statusHTML(itemStatus(id)) : ''}</div>`;
      }).join('')}</div>` : '';
      return `<div class="cgroup ${sel ? 'selected' : ''}">
        <div class="cgroup-head">
          <button class="cgroup-pick" type="button" data-a="pick" data-id="${esc(G.id)}" role="radio" aria-checked="${sel}">
            <span class="radio" aria-checked="${sel}"></span>
            <span class="body"><span class="title">${esc(G.lib === 'notes' && G.ids.length < 2 ? (ITEMS.get(G.ids[0]) || {}).en : G.name)}</span>
            <span class="meta"><span>${esc(groupCrumb(G).join(' / '))}</span><span>${s.fresh ? `待新学 ${s.fresh}` : '无待新学内容'} · 资料 ${s.ref}</span>${statusHTML(s.status)}</span></span>
          </button>
          <button class="expand" type="button" data-a="expand" data-id="${esc(G.id)}" aria-expanded="${open}" aria-label="展开组内内容">${svg('down')}</button>
        </div>${items}</div>`;
    }).join('');
    const G = ui.todaySel && GROUPS.get(ui.todaySel);
    const valid = G && G.lib === (ui.todayCat === 'function' ? 'function' : ui.todayCat);
    const s = valid ? gstats(G) : null;
    const summary = valid
      ? `已选「${esc(G.name)}」：<b>${s.fresh}</b> 条记忆、<b>${s.ref}</b> 条资料（资料不进入任务）${s.fresh > 20 ? ` · 将分 ${Math.ceil(s.fresh / 20)} 轮在今天完成` : ''}${!s.fresh ? ' · 展开后勾选要记忆的内容' : ''}`
      : '选择一个表达组；展开可以逐条决定记忆或资料';
    newPart = `<div class="seg" role="group" aria-label="内容分类">${cats.map(([k, t]) => `<button type="button" data-a="cat" data-c="${k}" aria-pressed="${ui.todayCat === k}">${t}</button>`).join('')}</div>
      ${ui.todayCat === 'function' ? '<p class="note-line">功能表达默认作为资料。勾选后才会进入新学和复习。</p>' : ui.todayCat === 'topic' ? '<p class="note-line">旧版主题表达组（v4 内容）。新结构的话题点上面的“主题表达”。</p>' : ''}
      ${groups.length ? `<div class="chooser" role="radiogroup" aria-label="表达组">${list}</div>` : `<div class="empty"><h3>还没有可学习的写作笔记</h3><p>导入并确认整理后，笔记组会出现在这里。</p><button class="btn btn-soft" type="button" data-go="import">导入笔记</button></div>`}
      <div class="sticky-bar"><span class="summary">${summary}</span><button class="btn btn-primary" type="button" data-a="startnew" ${valid && s.fresh ? '' : 'disabled'}>开始今日新学</button></div>`;
  }

  return {
    title: '今日学习', crumb: [fmtMD(Date.now())],
    body: `<section class="panel blush-soft"><div class="section-head"><h3>今日复习</h3><span class="hint">${dueN ? `共 ${dueN} 条到期 · 按到期时间和错误记录排序` : '由系统按到期日期生成'}</span></div>${review}</section>
      <section class="section"><div class="section-head"><h3>今日新学</h3><span class="hint">${ui.todayCat === 'topic' ? '一次学一个话题里的 3 个论点，约 12 条记忆内容' : '每次学习一个完整的表达组，建议 15–20 条记忆内容'}</span></div>${newPart}</section>`,
  };
}

/* ============================================================
   新学流程：理解场景 → 主动写出 → 句子应用
   ============================================================ */
function startNew(gid) {
  const G = GROUPS.get(gid); if (!G) return;
  const ids = stableIds(G).filter(id => modeOf(id) === 'memory' && !studied(id));
  if (!ids.length) { toast('这个组没有待新学的记忆内容'); return; }
  S.newSession = { gid, ids, rounds: chunk(ids, 20), round: 0, step: 'intro', queue: [], first: {}, again: {}, apply: [], ai: 0, fb: null };
  save();
  go({ v: 'learn' });
}
function pickApply(ids) {
  return shuffle(ids.filter(id => { const it = ITEMS.get(id); return it && it.type !== 'core' && it.type !== 'grammar' && it.ex && it.ex.toLowerCase().includes(it.en.toLowerCase()); })).slice(0, 3);
}
function finishNew() {
  const ns = S.newSession;
  ui.lastNew = { gid: ns.gid, ids: ns.ids.slice(), firstOk: ns.ids.filter(id => ns.first[id]).length };
  S.newSession = null;
  save();
}
function answerOf(it) { return it.en; }

function promptHTML(it, ctx) {
  const G = GROUPS.get(it.gid) || {};
  const zh = `<div class="prompt-zh">${esc(it.zh)}</div>`;
  if (ctx === 'apply') {
    return `<div class="prompt-hint"><span>把表达放进句子：${esc(it.zh)}</span><span class="en">${blankIn(it.ex, it.en)}</span></div>`;
  }
  switch (it.type) {
    case 'core':
      return `${zh}<div class="prompt-hint"><span>写出完整的英文中心句 · 表达组：${esc(G.name || '')}</span></div>`;
    case 'know': {
      const b = it.ex && blankIn(it.ex, it.en);
      return `${zh}${b ? `<div class="prompt-hint"><span>补全句子中的短语</span><span class="en">${b}</span></div>` : ''}`;
    }
    case 'term': {
      const col = it.col && it.col.toLowerCase() !== it.en.toLowerCase() ? (blankIn(it.col, it.en) || esc(it.col)) : '';
      return `${zh}<div class="prompt-hint"><span>场景：${esc(G.name || '')}</span>${col ? `<span>搭配提示：<span class="en">${col}</span></span>` : ''}</div>`;
    }
    case 'fn':
      return `<div class="prompt-hint"><span>写作功能：${esc(G.fn || '')}</span></div>${zh}<div class="prompt-hint"><span>语气：${esc(it.tone || '')}</span></div>`;
    case 'pattern':
      return `${zh}<div class="prompt-hint"><span>写出句型结构，可替换部分用 ... 表示</span></div>`;
    case 'grammar':
      return `<div class="prompt-hint"><span>改正下面的句子</span></div><div class="prompt-zh en" style="font-family:var(--f-en)">${esc(it.wrong)}</div>`;
    default:
      return `${zh}<div class="prompt-hint"><span>写出对应的英文表达</span></div>`;
  }
}
function fbHTML(d, it, revealed) {
  const verdict = revealed ? '正确答案' : d.ok ? '完全正确' : '有几处不同';
  const extra = [];
  if (it.type === 'grammar' && it.zh) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  else if (it.type !== 'grammar' && it.zh && revealed) extra.push(`<span class="warm" style="font-size:14px">${esc(it.zh)}</span>`);
  return `<div class="fb ${d.ok && !revealed ? 'ok' : 'bad'}"><div class="verdict">${verdict}</div>
    ${revealed || d.empty ? '' : `<div class="line"><span class="lbl">你的答案</span>${d.userHTML}</div>`}
    <div class="line"><span class="lbl">正确表达</span>${d.correctHTML}</div>${extra.join('')}</div>`;
}
function answerForm(fb, multiline) {
  return `<form data-form="answer" class="form" autocomplete="off">
    <input class="answer" id="answer" name="answer" type="text" value="${fb ? esc(fb.input) : ''}" ${fb ? 'readonly' : ''} placeholder="${multiline ? '写出完整句子' : '写出英文'}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="输入答案">
    ${fb ? '' : `<div class="btn-row"><button class="btn btn-primary" type="submit">提交答案</button><button class="btn btn-ghost" type="button" data-a="reveal">直接看答案</button></div>`}
  </form>`;
}

function vLearn() {
  const ns = S.newSession;
  if (!ns) return ui.lastNew ? vLearnDone() : { redirect: { v: 'today' } };
  const G = GROUPS.get(ns.gid);
  if (!G) { S.newSession = null; save(); return { redirect: { v: 'today' } }; }
  const roundIds = ns.rounds[ns.round];
  const stepIdx = { intro: 0, write: 1, apply: 2, rounddone: 3 }[ns.step];
  const steps = ['理解场景', '主动写出', '句子应用'].map((t, i) => `<span class="step ${i === stepIdx ? 'on' : i < stepIdx ? 'done' : ''}"><i>${i < stepIdx ? '✓' : i + 1}</i>${t}</span>`).join('');
  const roundTxt = ns.rounds.length > 1 ? `第 ${ns.round + 1} / ${ns.rounds.length} 轮 · ` : '';
  const head = `<div class="session-head"><div class="steps">${steps}</div><button class="btn btn-outline btn-sm" type="button" data-a="exit">退出并保存</button></div>`;
  let body = '';

  if (ns.step === 'intro') {
    const intro = roundIds.map(id => { const it = ITEMS.get(id); return it ? `<div class="intro-item">${typeTag(it.type)}<span class="en">${esc(it.en)}</span><span class="zh">${esc(it.zh)}</span>${it.ex ? `<span class="ex">${esc(it.ex)}</span>` : it.type === 'grammar' ? `<span class="ex">原句：${esc(it.wrong)}</span>` : ''}</div>` : ''; }).join('');
    body = `<div class="qcard"><div class="eyebrow">${roundTxt}先理解这个组<small>${esc(groupCrumb(G).join(' / '))}</small></div>
      <p class="prompt-zh" style="font-size:20px">${esc(G.scene || G.name)}</p>
      ${G.directions ? `<div class="chips">${G.directions.map(d => `<span class="chip">${esc(d)}</span>`).join('')}</div>` : ''}
      <div class="intro-list">${intro}</div>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-a="beginwrite" data-enter>开始主动写出</button><span class="note-line">本轮 ${roundIds.length} 条记忆内容；资料不进入任务</span></div></div>`;
  } else if (ns.step === 'write' || ns.step === 'apply') {
    const isApply = ns.step === 'apply';
    const id = isApply ? ns.apply[ns.ai] : ns.queue[0];
    const it = ITEMS.get(id);
    if (!it) {
      if (isApply) { ns.ai++; if (ns.ai >= ns.apply.length) endRound(); }
      else { ns.queue.shift(); if (!ns.queue.length) { ns.apply = pickApply(roundIds); ns.ai = 0; if (ns.apply.length) ns.step = 'apply'; else endRound(); } }
      save(); return vLearn();
    }
    const doneN = isApply ? ns.ai : roundIds.filter(x => studied(x)).length;
    const totalN = isApply ? ns.apply.length : roundIds.length;
    const fb = ns.fb;
    const d = fb ? diff(fb.input, answerOf(it)) : null;
    const contLabel = !fb ? '' : isApply ? (ns.ai + 1 < ns.apply.length ? '下一句' : '完成句子应用') : (d.ok && !fb.revealed ? '下一条' : '本轮稍后重写');
    body = `<div class="progress"><span>${roundTxt}${isApply ? '句子应用' : '主动写出'} ${doneN} / ${totalN}</span><div class="pbar"><i style="width:${totalN ? doneN / totalN * 100 : 0}%"></i></div></div>
      <div class="qcard">
        <div class="qtype">${typeTag(it.type)}<span>${isApply ? '受控句子 → 填入表达' : PROMPT_LABEL[it.type]}</span>${!isApply && ns.again[id] ? '<span class="tag" style="background:var(--wrong-soft);color:var(--wrong)">重写</span>' : ''}</div>
        ${promptHTML(it, isApply ? 'apply' : 'learn')}
        ${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="cont" data-enter>${contLabel}</button>${!isApply && !(d.ok && !fb.revealed) ? '<span class="note-line">写错的内容会留在本轮，稍后重新默写</span>' : ''}</div>` : ''}
      </div>`;
  } else if (ns.step === 'rounddone') {
    body = `<div class="qcard"><div class="eyebrow">第 ${ns.round + 1} 轮完成</div><p class="prompt-zh" style="font-size:20px">本组还有 ${ns.rounds.length - ns.round - 1} 轮，保持同一组的语境，在今天内完成。</p>
      <div class="btn-row"><button class="btn btn-primary" type="button" data-a="nextround" data-enter>开始第 ${ns.round + 2} 轮</button><button class="btn btn-outline" type="button" data-a="exit">稍后继续</button></div></div>`;
  }
  return { title: G.name, crumb: ['今日新学', ...groupCrumb(G)], focus: true, body: `<div class="session">${head}${body}</div>` };
}
function vLearnDone() {
  const r = ui.lastNew, G = GROUPS.get(r.gid);
  const dueN = dueCount();
  const ck = canCheckin();
  return {
    title: '本组新学完成', crumb: ['今日新学', G ? G.name : ''], focus: true,
    body: `<div class="session">
      <div class="result-tiles">
        <div class="panel sage"><span class="eyebrow">本组记忆</span><span class="big-num">${r.ids.length}<small>条</small></span></div>
        <div class="panel"><span class="eyebrow">第一次就写对</span><span class="big-num">${r.firstOk}<small>条</small></span></div>
        <div class="panel blush-soft"><span class="eyebrow">首次复习</span><span class="big-num" style="font-size:32px;line-height:1.6">${fmtMD(addDays(Date.now(), 1))}</span></div>
      </div>
      <div class="qcard"><p class="prompt-zh" style="font-size:20px">「${esc(G ? G.name : '')}」已完成新学。</p>
        <p class="warm">明天会第一次复习这 ${r.ids.length} 条内容，之后按约 3 天、7 天、14 天和 30 天继续安排。写错过的内容会在复习中优先出现。</p>
        ${dueN ? `<p class="note-line">今天还有 ${dueN} 条复习到期，完成后可以打卡。</p>` : ''}
        <div class="btn-row">
          ${ck ? '<button class="btn btn-primary" type="button" data-a="checkin-back">完成学习并打卡</button>' : dueN ? '<button class="btn btn-primary" type="button" data-a="startreview-replace">开始今日复习</button>' : ''}
          <button class="btn btn-outline" type="button" data-a="quick-replace" data-id="${esc(r.gid)}">快速复习本组</button>
          <button class="btn btn-ghost" type="button" data-a="donenew">返回</button>
        </div></div></div>`,
  };
}

/* ============================================================
   复习流程：按组进行，记得 / 模糊 / 忘记
   ============================================================ */
function startReview(gid, replace) {
  const q = dueQueue();
  const g = gid ? q.find(x => x.gid === gid) : q[0];
  if (!g) { toast('今天没有到期的复习'); return; }
  const order = q.findIndex(x => x.gid === g.gid);
  S.reviewSession = { gid: g.gid, ids: g.ids.slice(0, 20), i: 0, fb: null, ratings: {}, groupNo: order + 1, groupTotal: q.length, more: g.ids.length > 20 };
  save();
  (replace ? replaceRoute : go)({ v: 'review' });
}
function vReview() {
  const rs = S.reviewSession;
  if (!rs) return ui.lastReview ? vReviewDone() : { redirect: { v: 'today' } };
  const G = GROUPS.get(rs.gid);
  let id = rs.ids[rs.i], it = ITEMS.get(id);
  while (rs.i < rs.ids.length && !it) { rs.i++; id = rs.ids[rs.i]; it = ITEMS.get(id); }
  if (!it || !G) { finishReview(); return vReviewDone(); }
  const fb = rs.fb;
  const d = fb ? diff(fb.input, answerOf(it)) : null;
  let rates = '';
  if (fb) {
    const sug = fb.revealed ? 'fgt' : d.ok ? 'rem' : d.score >= 0.6 ? 'vag' : 'fgt';
    rates = `<div class="rates">${[['rem', '记得', 'r-rem'], ['vag', '模糊', 'r-vag'], ['fgt', '忘记', 'r-fgt']].map(([k, t, c], i) => `<button class="rate ${c} ${sug === k ? 'suggest' : ''}" type="button" data-a="rate" data-r="${k}" ${sug === k ? 'data-enter' : ''}><b>${t}</b><span>${nextIntervalLabel(id, k)}</span></button>`).join('')}</div>
      <p class="note-line">评分只记录这一次的表现，不会直接把内容改成永久掌握。</p>`;
  }
  const s = S.items[id] || {};
  return {
    title: G.name, crumb: ['今日复习', `第 ${rs.groupNo} / ${rs.groupTotal} 组`, ...groupCrumb(G)], focus: true,
    body: `<div class="session">
      <div class="session-head"><div class="progress" style="flex:1"><span>${rs.i + 1} / ${rs.ids.length}${rs.more ? ' · 本组分轮' : ''}</span><div class="pbar"><i style="width:${rs.i / rs.ids.length * 100}%"></i></div></div><button class="btn btn-outline btn-sm" type="button" data-a="exit">退出并保存</button></div>
      <div class="qcard">
        <div class="qtype">${typeTag(it.type)}<span>${PROMPT_LABEL[it.type]}</span>${s.wrong ? `<span class="tag" style="background:var(--wrong-soft);color:var(--wrong)">曾写错 ${s.wrong} 次</span>` : ''}</div>
        ${promptHTML(it, 'review')}
        ${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + rates : ''}
      </div></div>`,
  };
}
function finishReview() {
  const rs = S.reviewSession;
  const ratings = rs.ratings;
  const ids = Object.keys(ratings);
  const fgt = ids.filter(id => ratings[id] === 'fgt').length;
  let pulled = false;
  if (ids.length >= 4 && fgt / ids.length >= 0.5) {
    const cap = addDays(Date.now(), 3);
    ids.filter(id => ratings[id] === 'rem').forEach(id => { const s = st(id); if (s.next > cap) { s.next = cap; pulled = true; } });
  }
  ui.lastReview = { gid: rs.gid, ratings, ids, pulled, practiced: false };
  S.reviewSession = null;
  save();
}
function vReviewDone() {
  const r = ui.lastReview, G = GROUPS.get(r.gid);
  const c = { rem: 0, vag: 0, fgt: 0 };
  r.ids.forEach(id => c[r.ratings[id]]++);
  const wrongIds = r.ids.filter(id => r.ratings[id] !== 'rem' && ITEMS.has(id));
  const q = dueQueue();
  const ck = canCheckin();
  const l = todayLog();
  let main;
  if (q.length) main = `<button class="btn btn-primary" type="button" data-a="startreview-replace">继续下一组（还剩 ${q.length} 组）</button>`;
  else if (ck) main = `<button class="btn btn-primary" type="button" data-a="checkin-back">完成复习并打卡</button>`;
  else if (l.checked) main = `<span class="tag core">今天已打卡</span>`;
  else main = '';
  return {
    title: '本组复习完成', crumb: ['今日复习', G ? G.name : ''], focus: true,
    body: `<div class="session">
      <div class="result-tiles">
        <div class="panel sage"><span class="eyebrow">记得</span><span class="big-num">${c.rem}</span></div>
        <div class="panel linen"><span class="eyebrow">模糊</span><span class="big-num">${c.vag}</span></div>
        <div class="panel blush"><span class="eyebrow">忘记</span><span class="big-num">${c.fgt}</span></div>
      </div>
      ${r.pulled ? '<p class="note-line">本组错误较多，记得的内容也提前到 3 天内复习。</p>' : ''}
      ${wrongIds.length ? `<section class="section"><div class="section-head"><h3>需要再看一眼</h3><span class="hint">忘记的内容明天优先复习</span></div><div class="rows">${wrongIds.map(id => { const it = ITEMS.get(id); return `<div class="row"><div class="body tap" role="button" data-go="item:${esc(id)}"><span class="en title">${esc(it.en)}</span><span class="sub">${esc(it.zh)}</span></div><span class="tag ${r.ratings[id] === 'fgt' ? 'know' : 'term'}">${r.ratings[id] === 'fgt' ? '忘记' : '模糊'}</span></div>`; }).join('')}</div></section>` : ''}
      <div class="qcard"><p class="warm">${q.length ? '今天还有其他到期的表达组。每组单独完成，保持各自的语境。' : ck ? '今天到期的复习已经全部完成。确认后写入学习记录和月度日历。' : '今天到期的复习已经全部完成。'}</p>
        <div class="btn-row">${main}${wrongIds.length && !r.practiced ? '<button class="btn btn-soft" type="button" data-a="practice">再练一次错题</button>' : ''}<button class="btn btn-ghost" type="button" data-a="donereview">返回</button></div></div>
    </div>`,
  };
}
function vPractice() {
  const p = ui.practice;
  if (!p) return { redirect: { v: 'home' } };
  const id = p.ids[p.i], it = ITEMS.get(id);
  if (!it) { back(); return vReviewDone(); }
  const fb = p.fb, d = fb ? diff(fb.input, answerOf(it)) : null;
  return {
    title: '再练一次错题', crumb: ['今日复习'], focus: true,
    body: `<div class="session">
      <div class="session-head"><div class="progress" style="flex:1"><span>${p.i + 1} / ${p.ids.length} · 练习不改变复习安排</span><div class="pbar"><i style="width:${p.i / p.ids.length * 100}%"></i></div></div><button class="btn btn-outline btn-sm" type="button" data-a="back">结束练习</button></div>
      <div class="qcard"><div class="qtype">${typeTag(it.type)}<span>${PROMPT_LABEL[it.type]}</span></div>
        ${promptHTML(it, 'review')}${answerForm(fb, it.type === 'core' || it.type === 'grammar')}
        ${fb ? fbHTML(d, it, fb.revealed) + `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="cont" data-enter>${p.i + 1 < p.ids.length ? '下一条' : '完成练习'}</button></div>` : ''}
      </div></div>`,
  };
}

/* ============================================================
   快速复习：遮挡中文 / 遮挡英文 / 显示全部（不改变学习状态）
   ============================================================ */
function vQuick(r) {
  const G = GROUPS.get(r.id);
  if (!G) return { redirect: { v: 'home' } };
  if (ui.qrGid !== G.id) { ui.qrGid = G.id; ui.qrShown = new Set(); }
  const ids = stableIds(G);
  const m = ui.qrMode;
  const rows = ids.map(id => {
    const it = ITEMS.get(id);
    const hideEn = m === 'hide-en' && !ui.qrShown.has(id + ':en');
    const hideZh = m === 'hide-zh' && !ui.qrShown.has(id + ':zh');
    return `<div class="qr-row">
      <button class="qr-cell en ${hideEn ? 'masked' : ''}" type="button" data-a="qr" data-k="${esc(id)}:en" ${hideEn ? '' : 'tabindex="-1"'}>${esc(it.en)}</button>
      <button class="qr-cell zh ${hideZh ? 'masked' : ''}" type="button" data-a="qr" data-k="${esc(id)}:zh" ${hideZh ? '' : 'tabindex="-1"'}>${typeTag(it.type)} ${esc(it.zh)}${it.type === 'grammar' ? `<br><span class="muted">原句：${esc(it.wrong)}</span>` : ''}</button>
    </div>`;
  }).join('');
  return {
    title: '快速复习', crumb: groupCrumb(G).concat(G.name),
    body: `<div class="section-head"><div class="seg" role="group" aria-label="遮挡方式">${[['all', '显示全部'], ['hide-zh', '遮挡中文'], ['hide-en', '遮挡英文']].map(([k, t]) => `<button type="button" data-a="qrmode" data-m="${k}" aria-pressed="${m === k}">${t}</button>`).join('')}</div>

      <div class="rows">${rows}</div>
      ${m !== 'all' ? '<div class="btn-row"><button class="btn btn-outline btn-sm" type="button" data-a="qrreset">重新遮挡</button></div>' : ''}`,
  };
}

  if (s.fresh) btns.push(`<button class="btn ${s.due ? 'btn-outline' : 'btn-primary'}" type="button" data-a="sdlgroup" data-id="${esc(G.id)}">学这一组（${s.fresh} 条）</button>`);
  btns.push(`<button class="btn btn-outline" type="button" data-go="quick:${esc(G.id)}">快速复习</button>`);
  btns.push(`<button class="btn btn-soft" type="button" data-go="add:${esc(G.id)}">${svg('plus', 2)}${G.lib === 'notes' ? '添加卡片' : '添加表达'}</button>`);

}
function groupHero(G, s, cls, desc) {

    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="stats-line"><span><b>${s.total}</b>条</span><span><b>${s.mem}</b>记忆</span><span><b>${s.ref}</b>资料</span>${s.last ? `<span>上次学习 ${agoDay(s.last)}</span>` : ''}${s.next < Infinity ? `<span>下次复习 ${relDay(s.next)}</span>` : ''}<span>${statusHTML(s.status)}</span></div>
    ${groupActions(G, s)}</section>`;
}
function vGroup(r) {
  const G = GROUPS.get(r.id);

  const s = gstats(G);
  const ids = stableIds(G);

    const phr = ids.map(id => ITEMS.get(id)).filter(it => it.type !== 'core').map(it => it.en);
    const cores = ids.map(id => ITEMS.get(id)).filter(it => it.type === 'core').map(it => it.en.replace(/\.$/, ''));
    body = groupHero(G, s, '', G.scene) +
      sec('核心论点', '可作为主体段中心句 · 默认记忆', by('core'), {}) +
      (G.directions ? `<section class="section"><div class="section-head"><h3>可展开方向</h3><span class="hint">这一条观点可以写什么</span></div><div class="chips">${G.directions.map(d => `<span class="chip">${esc(d)}</span>`).join('')}</div></section>` : '') +
      sec('知识表达', '解释论点的作用、机制和结果 · 默认资料', by('know'), { ex: true }) +
      sec('专业词汇 / 固定搭配', '具体场景中的术语和搭配 · 默认资料', by('term'), { ex: true }) +
      (G.paragraph ? `<section class="section"><div class="section-head"><h3>示例段落</h3><span class="hint">浅绿为组内表达，浅粉为核心论点</span></div><div class="paragraph">${markText(G.paragraph, cores.map(p => ({ p, cls: 'core' })).concat(phr.map(p => ({ p }))))}</div></section>` : '') +
      (G.related && G.related.length ? `<section class="section"><div class="section-head"><h3>相关表达</h3></div><div class="chips">${G.related.map(x => GROUPS.get(x)).filter(Boolean).map(X => `<button class="chip" type="button" data-go="group:${esc(X.id)}">${esc(X.topic)} · ${esc(X.name)}</button>`).join('')}</div></section>` : '');
  } else if (G.lib === 'function') {
    const rows = ids.map(id => {
      const it = ITEMS.get(id);
      return `<tr><td class="expr"><button type="button" data-go="item:${esc(id)}">${esc(it.en)}</button><div class="muted" style="font-size:13px">${esc(it.zh)}</div></td><td>${esc(it.syntax || '')}</td><td>${esc(it.tone || '')}</td><td>${esc(it.diff || '')}</td><td>${modeToggle(id)}</td></tr>`;
    }).join('');
    body = groupHero(G, s, 'fn', G.scene + ' 功能表达默认作为资料，切换为记忆后才进入新学和复习。') +
      `<section class="section"><div class="section-head"><h3>近义表达比较</h3><span class="hint">横向滑动查看完整表格</span></div><div class="cmp-wrap"><table class="cmp"><thead><tr><th>表达</th><th>句法</th><th>语气和边界</th><th>近义区别</th><th>学习方式</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="section"><div class="section-head"><h3>示例句与常见错误</h3></div><div class="rows">${ids.map(id => { const it = ITEMS.get(id); return `<div class="row white"><div class="body"><span class="en" style="font-size:17px">${highlightIn(it.ex || '', [fixedPart(it.en)])}</span>${it.err ? `<span class="meta">常见错误：${esc(it.err)}</span>` : ''}</div>${favBtn(id)}</div>`; }).join('')}</div></section>`;
  } else {
    const set = noteSet(G.setId);
    body = groupHero(G, s, 'notes', (set ? set.title : '') + ' · ' + KIND_LABEL[G.kind]) +
      `<section class="section"><div class="section-head"><h3>组内卡片</h3><span class="hint">${G.ids.length} 张${KIND_LABEL[G.kind].replace('组', '卡')}</span></div><div class="rows">${ids.map(id => itemRow(id, { tag: true })).join('')}</div></section>`;
  }
  const title = G.lib === 'notes' && G.ids.length < 2 ? '独立卡片' : G.name;
  return { title, crumb: groupCrumb(G), body };
}

/* ---------- 条目详情 ---------- */
function vItem(r) {
  const it = ITEMS.get(r.id);
  if (!it) return { redirect: { v: 'home' } };
  if (it.lib === 'function' || it.lib === 'notes') return vItemDetail(it);
  const G = GROUPS.get(it.gid);
  const s = S.items[it.id] || {};
  const block = (label, val, cls = '') => val ? `<div class="field-block ${cls}"><span class="label">${label}</span><div class="val ${cls.includes('en') ? 'en' : ''}">${val}</div></div>` : '';
  let main = `<div class="expr-hero"><div class="qtype">${typeTag(it.type)}${it.lib === 'function' ? `<span class="tag">${esc(G.fn)}</span>` : ''}${statusHTML(itemStatus(it.id))}</div>
    <div class="en">${esc(it.en)}</div><div class="zh">${esc(it.zh)}</div></div>`;
  if (it.lib === 'topic') {
    main += block('例句', it.ex ? highlightIn(it.ex, [it.en]) : '', 'en') +
      block('常用搭配', esc(it.col)) + block('使用提醒', esc(it.usage)) + block('常见错误', esc(it.err)) +
      block('来源', esc(it.src || (it.custom ? '自己添加 · ' + G.topic + ' / ' + G.sub : '')));
  } else if (it.lib === 'function') {
    const others = G.ids.filter(x => x !== it.id).map(x => ITEMS.get(x));
    main += block('写作功能', esc(G.fn) + ' · ' + esc(G.scene || '')) +
      block('句法结构', esc(it.syntax)) + block('语气和使用边界', esc(it.tone)) +
      (others.length ? `<div class="field-block"><span class="label">近义表达比较</span><div class="rows" style="margin-top:6px">${it.diff ? `<div class="row" style="background:var(--sage-soft)"><div class="body"><span class="en title">${esc(it.en)}</span><span class="sub">${esc(it.diff)}</span></div></div>` : ''}${others.map(o => `<button class="row tap" type="button" data-go="item:${esc(o.id)}"><div class="body"><span class="en title">${esc(o.en)}</span><span class="sub">${esc(o.diff || o.zh)}</span></div>${svg('chev')}</button>`).join('')}</div></div>` : '') +
      block('示例句', it.ex ? highlightIn(it.ex, [fixedPart(it.en)]) : '', 'en') + block('常见错误', esc(it.err));
  } else {
    const set = noteSet(it.setId);
    const src = `来源：${esc(set ? set.title : '手动添加')}${it.line ? ` · 第 ${it.line} 行` : ''}`;
    const info = (label, val, wide, cls = '') => `<div class="field-block ${wide ? 'wide' : ''}"><span class="label">${label}</span><div class="val ${cls}">${val}</div></div>`;
    let blocks = [], missing = [];
    const add = (label, raw, html, wide, cls) => { if (raw) blocks.push(info(label, html, wide, cls)); else missing.push(label); };
    if (it.type === 'expr') {
      add('例句', it.ex, highlightIn(it.ex || '', [it.en]), true, 'en');
      add('常用搭配', it.col, esc(it.col), false);
      add('使用场景', it.usage, esc(it.usage), false);
      add('常见错误', it.err, esc(it.err), true);
    } else if (it.type === 'pattern') {
      add('可替换位置', it.slots, esc(it.slots), false);
      add('适用场景', it.scene, esc(it.scene), false);
      add('示例句', it.ex, highlightIn(it.ex || '', [fixedPart(it.en)]), true, 'en');
      add('常见错误', it.err, esc(it.err), true);
    } else {
      blocks.push(`<div class="pair wide"><div class="field-block wrongline"><span class="label">错误例句</span><div class="val en">${esc(it.wrong)}</div></div><div class="field-block rightline"><span class="label">正确例句</span><div class="val en">${esc(it.en)}</div></div></div>`);
      add('语法规则', it.rule, esc(it.rule), true);
      add('更多正确例句', it.ex, esc(it.ex), true, 'en');
      add('使用限制', it.limit, esc(it.limit), true);
    }
    main = `<div class="expr-hero compact"><div class="qtype">${typeTag(it.type)}${statusHTML(itemStatus(it.id))}</div>
      <div class="en">${esc(it.en)}</div>${it.zh ? `<div class="zh">${it.type === 'grammar' ? '中文解释：' : it.type === 'pattern' ? '中文功能：' : ''}${esc(it.zh)}</div>` : ''}
      <div class="note-line">${src}</div></div>
      <div class="info-grid">${blocks.join('')}</div>` +
      (missing.length ? `<div class="fill-hint"><span>还可以补充：${missing.join('、')}</span><button class="btn btn-soft btn-sm" type="button" data-go="edit:${esc(it.id)}">补充内容</button></div>` : '') +
      `<div class="field-block drill">
        <div class="kv-line"><span class="label">受控练习</span><span class="val muted">${it.type === 'grammar' ? '不看上面，改写错误例句' : PROMPT_LABEL[it.type]} · 不影响学习记录</span></div>
        <form data-form="drill" data-id="${esc(it.id)}" class="btn-row" style="align-items:stretch"><input class="answer" id="drill-in" style="flex:1 1 260px;font-size:18px;padding:10px 16px" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${it.type === 'grammar' ? '写出改正后的句子' : '写出英文'}"><button class="btn btn-outline" type="submit">检查</button></form>
        <div id="drill-fb"></div></div>`;
  }
  const idx = G.ids.indexOf(it.id), nextId = G.ids[(idx + 1) % G.ids.length];
  const hist = (s.hist || []).slice(-6).reverse();
  const RL = { rem: '记得', vag: '模糊', fgt: '忘记' };
  const side = `<section class="panel line">
      <div class="eyebrow">学习方式</div>${modeToggle(it.id, true)}
      <p class="note-line">资料只用于查阅，不计入每日学习量和复习队列。</p>
      <div><div class="kv"><span>状态</span><b>${itemStatus(it.id)}</b></div>
      <div class="kv"><span>下次复习</span><b>${s.next != null && modeOf(it.id) === 'memory' ? relDay(s.next) : '—'}</b></div>
      <div class="kv"><span>上次学习</span><b>${s.last ? agoDay(s.last) : '—'}</b></div>
      <div class="kv"><span>写错次数</span><b class="num">${s.wrong || 0}</b></div></div>
      ${hist.length ? `<div class="chips">${hist.map(h => `<span class="tag ${h.r === 'rem' ? 'core' : h.r === 'fgt' ? 'know' : ''}">${agoDay(h.t)} · ${h.p === 'new' ? '新学' : RL[h.r]}</span>`).join('')}</div>` : ''}
    </section>
    <section class="panel line"><div class="panel-head"><div class="eyebrow">个人备注</div>${favBtn(it.id)}</div>
      <textarea class="note" id="note-${esc(it.id)}" data-note="${esc(it.id)}" placeholder="记录自己的用法、易错点或出处">${esc(s.note || '')}</textarea></section>
    <div class="btn-row">${G.ids.length > 1 ? `<button class="btn btn-outline" type="button" data-a="nextitem" data-id="${esc(nextId)}">组内下一条</button>` : ''}
      ${it.lib === 'notes' ? `<button class="btn btn-soft" type="button" data-go="edit:${esc(it.id)}">编辑卡片</button>` : ''}
      ${it.custom || it.lib === 'notes' ? `<button class="btn btn-ghost btn-danger" type="button" data-a="delitem" data-id="${esc(it.id)}" data-confirm="确认删除">删除</button>` : ''}</div>`;
  return { title: G.lib === 'notes' && G.ids.length < 2 ? '独立卡片' : G.name, crumb: groupCrumb(G), body: `<div class="detail"><div class="detail-main ${it.lib === 'notes' ? 'tight' : ''}">${main}</div><aside class="detail-side">${side}</aside></div>` };
}

/* ---------- 添加 / 编辑 ---------- */
function segHTML(name, opts, val) {

}
function vAdd(r) {

  const lib = G.lib;
  let typeSeg = '', extra = '';
  if (lib === 'topic') typeSeg = `<div class="fld">组内角色${segHTML('type', [['core', '核心论点'], ['know', '知识表达'], ['term', '专业词汇']], 'know')}</div>`;
  if (lib === 'notes') typeSeg = `<div class="fld">卡片类型${segHTML('type', [['expr', '表达卡'], ['pattern', '句型卡'], ['grammar', '语法卡']], G.kind)}</div>`;
  if (lib === 'function') extra = `<label class="fld">句法结构<input name="syntax" placeholder="例如 This can lead to + 名词"></label><label class="fld">语气和使用边界<input name="tone" placeholder="例如 中性，强调可能结果"></label><label class="fld wide">近义区别<input name="diff"></label>`;
  if (lib === 'notes') extra = 'NOTES';
  return {
    title: lib === 'notes' ? '添加卡片' : '添加表达', crumb: groupCrumb(G).concat(G.name),
    body: `<form class="form panel line" data-form="add" data-id="${esc(G.id)}" style="max-width:820px">

const T = { topics: [], topic: new Map(), arg: new Map(), item: new Map(), term: new Map() };

        T.item.set(it.id, it); A.items.push(it.id);

const ladder = () => S.t3.set.extend ? [1, 3, 7, 14, 30, 60] : [1, 3, 7, 14, 30];

/* ---------- 判定：正确 / 形式不对 / 只错一点 / 错得较多 ---------- */
const IRR = { is: 'be', am: 'be', are: 'be', was: 'be', were: 'be', been: 'be', being: 'be', has: 'have', had: 'have', does: 'do', did: 'do', done: 'do', went: 'go', gone: 'go', underwent: 'undergo', undergone: 'undergo', fell: 'fall', fallen: 'fall', gave: 'give', given: 'give', took: 'take', taken: 'take', made: 'make', led: 'lead', felt: 'feel', kept: 'keep', brought: 'bring', sold: 'sell', paid: 'pay', spent: 'spend', grew: 'grow', grown: 'grow', rose: 'rise', risen: 'rise', children: 'child', people: 'person', men: 'man', women: 'woman' };

  if (IRR[w]) return IRR[w];

  if (s.length > 4 && /ies$/.test(s)) s = s.slice(0, -3) + 'y';
  else if (s.length > 4 && /ied$/.test(s)) s = s.slice(0, -3) + 'y';
  else if (s.length > 5 && /ing$/.test(s)) s = s.slice(0, -3);
  else if (s.length > 4 && /ed$/.test(s)) s = s.slice(0, -2);
  else if (s.length > 4 && /es$/.test(s)) s = s.slice(0, -2);
  else if (s.length > 3 && /s$/.test(s) && !/(ss|us|is)$/.test(s)) s = s.slice(0, -1);
  s = s.replace(/e$/, '');
  if (/([b-df-hj-np-tv-z])\1$/.test(s)) s = s.slice(0, -1);

function findRanges(text, specs) {

    while (i >= 0 && (out.some(r => i < r.e && i + p.length > r.s) || isW(text[i - 1]) || isW(text[i + p.length]) && isW(p[p.length - 1]))) i = low.indexOf(p, i + 1);

function t3PendRows(pend) {
  const byCombo = new Map();
  pend.forEach(id => { const c = comboOf(id); const k = c ? c.id : id; if (!byCombo.has(k)) byCombo.set(k, []); byCombo.get(k).push(id); });
  return [...byCombo.entries()].map(([k, ids]) => {
    const c = S.t3.combos.find(x => x.id === k);
    if (c && c.args.length > 1 && c.args.every(a => ids.includes(a))) {
      return `<div class="t-pendrow"><span class="txt"><b>整个写作组合从头开始？</b><small>${esc(T.topic.get(c.topic).name)} · ${ids.length} 个论点都评为忘记</small></span><span class="btn-row"><button class="btn btn-sm t-danger" type="button" data-a="t3restart" data-id="${ids.join(',')}">从头开始 · 回到次日档</button><button class="btn btn-sm btn-ghost" type="button" data-a="t3stepback" data-id="${ids.join(',')}">先不，只退一格</button></span></div>`;

      return `<div class="t-pendrow"><span class="txt"><b>论点 ${A.n} · ${esc(A.short)}</b><small>${esc(T.topic.get(A.topic).name)} · ${A.items.length} 条里忘记 ${f} 条 · 原来在 ${STAGE_LABEL[rec.pend.prev]}</small></span><span class="btn-row"><button class="btn btn-sm t-danger" type="button" data-a="t3restart" data-id="${id}">从头开始 · 回到次日档</button><button class="btn btn-sm btn-ghost" type="button" data-a="t3stepback" data-id="${id}">先不，只退一格</button></span></div>`;
    }).join('');
  }).join('');
}
function t3Prac() {

  html += `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="t3startall">开始今日复习</button><span class="note-line">共 ${P.n + oldN} 条 · 从${P.mk.length ? '补练' : P.n ? '论点' : '第 1 组'}开始；每完成一个论点会显示它的结果，可以随时退出</span></div>`;

/* ============================================================
   详情页：论点句（AA）· 展开表达（AB）· 话题词汇（AC）
   ============================================================ */
function wrongList(id) {
  const ans = tget(id).en, rec = id.startsWith('tt:') ? S.t3.term[id] : S.t3.it[id];
  const ws = (rec && rec.wrongs) || [];
  const m = new Map();
  ws.forEach(w => { const k = w.input.trim().toLowerCase(); const x = m.get(k); if (x) { x.n++; if (w.t > x.t) Object.assign(x, { t: w.t, r: w.r }); } else m.set(k, Object.assign({ n: 1 }, w)); });
  const list = [...m.values()].sort((a, b) => b.t - a.t).slice(0, 5);
  if (!list.length) return '<span class="note-line">还没有写错过。复习和新学时写错的答案会自动收在这里。</span>';
  return list.map(w => { const d = diff(w.input, ans); return `<div class="t-wrong"><small>${fmtMD(w.t)} · ${RL3[w.r] || '写错'}${w.n > 1 ? ` · ${w.n} 次` : ''}</small><span class="en">${d.userHTML}</span><span class="en ok">→ ${esc(ans)}</span></div>`; }).join('');
}
function histDots(hist) {
  const h = (hist || []).slice(-6);
  if (!h.length) return '';
  return `<div class="t-dots">${h.map(x => { const d = new Date(x.t); return `<span title="${RL3[x.r]}"><i class="${x.r}"></i>${d.getMonth() + 1}/${d.getDate()}</span>`; }).join('')}</div>`;
}
function t3Side(id) {
  const isTerm = id.startsWith('tt:');
  const it = tget(id), A = isTerm ? null : T.arg.get(it.arg), tp = T.topic.get(isTerm ? it.topic : A.topic);
  const path = isTerm ? `${esc(tp.theme)} › ${esc(tp.name)} › 话题词汇 › <b>${esc(it.cat)}</b>` : `${esc(tp.theme)} › ${esc(tp.name)} › ${esc(A.stance)} › <b>论点 ${A.n} · ${esc(A.short)}${it.kind === 'exp' ? ' › ' + it.role : ''}</b>`;
  const back = isTerm ? (termArgs(id)[0] ? `<button class="t-link-btn" type="button" data-go="tpara:${termArgs(id)[0]}">在范文里看 ›</button>` : '') : `<button class="t-link-btn" type="button" data-go="tpara:${A.id}">回到范文段落 ›</button>`;
  let status;
  if (isTerm) {
    const r = S.t3.term[id] || {};
    status = r.mode === 'memory' && r.stage != null
      ? `<b class="t-stage">${STAGE_LABEL[r.stage]} · 下次 ${fmtMD(r.next)}</b><span class="note-line">每个词单独安排 · 下次第 ${(r.n || 0) + 1} 次：${((r.n || 0) + 1) % 2 ? '看中文写英文' : '例句填空'}</span>${histDots(r.hist)}`
      : r.mode === 'memory' ? `<b class="t-stage">已加入记忆</b><span class="note-line">下次新学这个话题时，会放在最后一轮收尾</span><button class="btn btn-ghost btn-sm" type="button" data-a="t3termmem" data-id="${id}">改回资料</button>`
      : `<b class="t-stage">资料 · 不复习</b><button class="btn btn-soft btn-sm" type="button" data-a="t3termmem" data-id="${id}">加入记忆</button>`;
  } else {
    const r = argRec(A.id);
    status = r.mode === 'memory' && r.stage != null
      ? `<b class="t-stage">${r.pend ? '等你确认是否从头开始' : STAGE_LABEL[r.stage] + ' · 下次 ' + fmtMD(r.next)}</b><span class="note-line">${it.kind === 'exp' ? `跟着论点 ${A.n} 一起安排${(S.t3.it[id] || {}).makeup ? ' · 在补练中（' + fmtMD(S.t3.it[id].makeup) + '）' : ''}` : `整个论点一起安排，${A.items.length} 条共用这个日期`}</span>${histDots(it.kind === 'exp' ? (S.t3.it[id] || {}).hist : r.hist)}`
      : `<b class="t-stage">资料 · 不复习</b><span class="note-line">选进写作组合后才会复习</span>${learnedArg(A.id) ? '' : `<button class="btn btn-soft btn-sm" type="button" data-go="tpick:${tp.id}">去选论点</button>`}`;
  }
  if (ui.impPreview) status = `<b class="t-stage">还没导入</b><span class="note-line">${isTerm ? '确认导入后按笔记里写的【记忆】【资料】，没写就按设置里的默认值' : '确认导入后，在“选论点”时选进写作组合才开始学和复习'}</span>`;
  return `<aside class="t-dside">
    <div class="blk"><small>在哪里</small><span class="path">${path}</span>${back}</div>
    <div class="blk"><small>复习状态</small>${status}</div>
    <div class="blk"><small>我写错过的</small>${wrongList(isTerm ? id : it.kind === 'sent' ? A.id + ':s' : id)}</div>
  </aside>`;
}

      ${sec3('段落骨架', '这一段怎么展开：一句论点，三条展开', `<div class="t-chainlist">${chain}</div>`)}
      ${pat ? sec3('句型', '标出的部分可以换，句子结构可以搬到别的话题', pat) : ''}

/* ---------- 交互 ---------- */
function t3ctx() {
  const v = cur().v;
  if (v === 'tlearn') {
    const L = S.t3.learn;
    if (L.step === 'write') { const id = L.q[0]; return { h: L, id, ans: T.item.get(id).en, learn: true }; }
    if (L.step === 'fill') { const id = feKey(L.fill); return { h: L, id, ans: blankAnswer(id), learn: true, fill: true }; }
    if (L.step === 'terms') { const x = L.tq[0]; return { h: L, id: x.id, part: x.part, ans: T.term.get(x.id).en, learn: true }; }
  }
  if (v === 'trev') {
    const R = S.t3.rev, q = R.queue[R.i], u = R.u;
    if (q.k === 'arg') { const id = u.step === 'fill' ? (u.fb ? u.cur : feKey(u)) : u.list[u.j]; return { h: u, id, ans: u.step === 'fill' ? blankAnswer(id) : T.item.get(id).en, arg: true }; }
    return { h: u, id: q.id, ans: tget(q.id).en };
  }
  if (v === 'tpara' && ui.t3pp) { const P = ui.t3pp, id = feKey(P); return id ? { h: P, id, ans: blankAnswer(id), prac: true, pp: true } : null; }
  if (v === 'iprac') { const p = ui.iprac; return { h: p, id: p.id, ans: pracAns(ITEMS.get(p.id)), prac: true }; }
  if (v === 'tprac') { const p = ui.t3prac; return { h: p, id: p.ids[p.i], ans: anyItem(p.ids[p.i]).en, prac: true }; }
  return null;
}
function t3answer(input, revealed) {
  const c = t3ctx();
  if (!c) return;
  const g = grade(input, c.ans, revealed);
  const fb = { input: revealed ? '' : input, g: g.g, tier: g.tier, hinted: !!c.h.hinted };
  c.h.fb = fb;
  if (c.learn) {
    const L = c.h;
    if (L.step === 'write' && !L.first[c.id]) L.first[c.id] = ansOf(fb);
    if (L.step === 'fill') { L.fill.res[c.id] = fb; if (!L.fill.first[c.id]) L.fill.first[c.id] = ansOf(fb); }
    if (L.step === 'terms' && !L.tfirst[c.id + ':' + c.part]) L.tfirst[c.id + ':' + c.part] = ansOf(fb);
    if (fb.g !== 'rem' && fb.input) RR(c.id).wrongs.push({ t: Date.now(), input: fb.input, r: fb.g });
  }
  if (c.pp) c.h.res[c.id] = fb;
  if (c.arg) { c.h.ans[c.id] = fb; if (c.h.step === 'fill') { c.h.done[c.id] = true; c.h.cur = c.id; } }
  if (!c.prac) save();
  render();
}
function t3next() {
  const v = cur().v;
  if (v === 'tlearn') { t3LearnNext(); return; }
  if (v === 'tpara' && ui.t3pp) { const P = ui.t3pp, k = feKey(P); if (k) { P.done[k] = true; P.cur = k; } P.fb = null; P.hinted = false; feNext(P); render(); return; }
  if (v === 'tprac') { const p = ui.t3prac; p.i++; p.fb = null; p.hinted = false; if (p.i >= p.ids.length) { ui.t3prac = null; back(); toast('错题练习完成'); } else render(true); return; }
  const R = S.t3.rev, q = R.queue[R.i], u = R.u;
  if (q.k === 'arg') { t3ArgAdvance(u, q); save(); render(true); return; }
  t3Commit();
}
function t3click(a, el) {

    case 't3learnclose': S.t3.learn = null; save(); back(); return true;
    case 't3learnck': S.t3.learn = null; checkin(); back(); return true;
    case 't3startall': {

    }

    case 't3irate': { const u = S.t3.rev.u; u.rate[id] = el.dataset.r; u.argR = null; save(); render(); return true; }
    case 't3argr': { const u = S.t3.rev.u; u.argR = el.dataset.r; save(); render(); return true; }
    case 't3trate': { const u = S.t3.rev.u; u.r = el.dataset.r; save(); render(); return true; }
    case 't3commit': t3Commit(); return true;
    case 't3restart': case 't3stepback': {

function t3submit(kind, f) {

/* ============================================================
   学习记录（PRD 第五部分）：概览 · 词条清单 · 复习日程 · 薄弱项
   覆盖主题表达、话题词汇、写作笔记、功能表达和旧版表达组里“记忆”中、已经学过的内容
   ============================================================ */
const SRC3 = { topic: ['主题表达', 'core'], term: ['话题词汇', 'term'], notes: ['写作笔记', 'know'], fn: ['功能表达', 'grammar'], old: ['旧版', ''] };
function weakCfg() { const s = S.t3.set; return { n: s.weakN || 3, m: s.weakM || 2, last: s.weakLast !== false }; }
function weakOf(x) {
  const h = x.hist;
  if (!h.length) return null;
  const c = weakCfg(), last = h[h.length - 1], win = h.slice(-c.n), bad = win.filter(r => r !== 'rem').length;
  const two = h.slice(-2);
  if (c.last && last === 'fgt') return two.length === 2 && two[0] === 'fgt' ? '最近两次都忘记' : '上次忘记' + (x.makeup ? ' · 在补练中' : '');
  if (bad >= Math.min(c.m, c.n)) return two.length === 2 && two.every(r => r === 'vag') ? '最近两次都模糊' : two.length === 2 && two.every(r => r === 'fgt') ? '最近两次都忘记' : `最近 ${win.length} 次里 ${bad} 次模糊 / 忘记`;
  return null;
}
function recAll() {
  const out = [];
  for (const [aid, A] of T.arg) {
    const r = S.t3.arg[aid];
    if (!r || r.mode !== 'memory' || r.stage == null) continue;
    const tp = T.topic.get(A.topic);
    for (const id of A.items) {

      out.push({ id, en: it.en, zh: it.zh, src: 'topic', sub: `${tp.name} · 论点 ${A.n} · ${it.role}`, stage: r.stage, next: r.next, pend: !!r.pend, first: ((ir.hist || [])[0] || (r.hist || [])[0] || {}).t || r.last || 0, hist: (ir.hist || []).map(h => h.r), wrongs: ir.wrongs || [], wrongN: (ir.wrongs || []).length, makeup: ir.makeup, route: t3route(id), arg: aid });
    }
  }
  for (const [id, t] of T.term) {
    const r = S.t3.term[id];
    if (!r || r.mode !== 'memory' || r.stage == null) continue;
    out.push({ id, en: t.en, zh: t.zh, src: 'term', sub: `${T.topic.get(t.topic).name} · ${t.cat}`, stage: r.stage, next: r.next, first: ((r.hist || [])[0] || {}).t || r.last || 0, hist: (r.hist || []).map(h => h.r), wrongs: r.wrongs || [], wrongN: (r.wrongs || []).length, route: 'tterm:' + id });

}

/* ---------- 词条清单 ---------- */

/* ---------- 复习日程 ---------- */
function dayEntries(t, all) {

    P.args.forEach(id => { const A = T.arg.get(id); rows.push({ kind: '论点', en: A.en, zh: `论点 ${A.n} · ${A.short} · 跟论点一起，共 ${A.items.length} 条`, route: 'targ:' + id, x: { stage: argRec(id).stage, weak: false } }); });
    P.terms.forEach(id => rows.push({ kind: '话题词汇', en: T.term.get(id).en, zh: T.term.get(id).zh, route: 'tterm:' + id, x: all.find(x => x.id === id) }));
    dueQueue().forEach(g => g.ids.forEach(id => { const x = all.find(y => y.id === id); if (x) rows.push({ kind: SRC3[x.src][0], en: x.en, zh: x.zh, route: x.route, x }); }));
