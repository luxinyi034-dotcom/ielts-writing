/* ============================================================
   导入（PRD 第七部分）：主题表达的写法、预览和合并；导入页、设置里的默认学习方式
   写作笔记和功能表达的解析在 app.js 的 parseNotes / createNoteSet
   ============================================================ */
const ROLE_RE = /^(解释|结果|举例|原因|对比|让步|补充|影响)\s*[:：]\s*(.+)$/;
const ARG_F = { 可替换: 'slots', 换个话题: 'apply' };
const EXP_F = { 原形: 'base', 引导句: 'lead', 提醒: 'usage', 也可以说: 'alt', 范文里写成: 'para', 搭配: 'col', 拆分: 'parts' };
const TERM_F = { 范畴: 'cat', 词性: 'pos', 例句: 'ex', 动词搭配: 'verbs', 这样写: 'ok', 不这样写: 'bad' };
const ALL_LABELS = Object.keys(ARG_F).concat(Object.keys(EXP_F), Object.keys(TERM_F), ['范文', '大主题', '关键概念']);
const LABEL_RE = new RegExp(`(?:^|\\s)(${ALL_LABELS.sort((a, b) => b.length - a.length).join('|')})\\s*[:：]`, 'g');
const slashList = v => v.split(/\s*[/／|]\s*/).map(x => x.trim()).filter(Boolean);

// 一行里可以写好几个“标签：内容”（范畴：伦理　词性：n.）
function lineFields(line) {
  const hits = [...line.matchAll(LABEL_RE)];
  if (!hits.length || line.slice(0, hits[0].index).trim()) return null;
  return hits.map((m, i) => ({ k: m[1], v: line.slice(m.index + m[0].length, i + 1 < hits.length ? hits[i + 1].index : undefined).trim() }));
}

/* 把文字里的“# 话题：……”块挑出来；其余的行原样留给笔记解析（行号不变） */
function parseTopics(text) {
  const lines = cleanImportText(text).split('\n');
  const rest = lines.slice();
  const blocks = [];
  let B = null, st = null, A = null, last = null, mode = '', inPara = false;
  const flushPara = () => { inPara = false; };
  lines.forEach((raw, idx) => {
    const line = raw.trim();
    const h1 = line.match(/^#\s+(.+)$/);
    if (h1) {
      const m = h1[1].match(/^话题\s*[:：]\s*(.+)$/);
      if (m) {
        B = { name: m[1].trim(), theme: '', concepts: [], stances: [], terms: [], line: idx + 1, unrec: [] };
        blocks.push(B); st = A = last = null; mode = 'top'; flushPara(); rest[idx] = ''; return;
      }
      B = null;
    }
    if (!B) return;
    rest[idx] = '';
    if (!line) { if (inPara && A && A.para) A.para += ' '; return; }
    const h2 = line.match(/^##\s+(.+)$/), h3 = line.match(/^###\s+(.+)$/);
    if (h2) {
      flushPara(); A = last = null;
      const t = h2[1].trim();
      if (/^话题词汇/.test(t)) { mode = 'terms'; return; }
      const m = t.match(/^立场\s*[:：]\s*(.+)$/);
      const body = (m ? m[1] : t).trim();
      const parts = body.split(/\s*[|｜]\s*|　+|\s{2,}/).filter(Boolean);
      st = { name: parts[0], idea: parts.slice(1).join(' '), args: [] };
      B.stances.push(st); mode = 'stance'; return;
    }
    if (h3) {
      flushPara();
      const m = h3[1].trim().match(/^论点\s*\d*\s*[:：·]?\s*(.+)$/);
      if (!st) { st = { name: '支持', idea: '', args: [] }; B.stances.push(st); }
      A = { short: (m ? m[1] : h3[1]).trim(), en: '', zh: '', para: '', exps: [], line: idx + 1 };
      st.args.push(A); last = A; mode = 'arg'; return;
    }
    const tm = takeMode(line.replace(/^(?:[-*+•·]|\d+[.)、])\s+/, ''));
    const body = tm.line;
    const pm = body.match(/^范文\s*[:：]\s*(.*)$/);
    if (pm && A) { A.para = pm[1].trim(); inPara = true; return; }
    const isBullet = /^(?:[-*+•·]|\d+[.)、])\s+/.test(line);
    if (inPara && A && !isBullet && !lineFields(body)) { A.para = (A.para + ' ' + body).trim(); return; }
    flushPara();
    const fields = lineFields(body);
    if (fields) {
      for (const { k, v } of fields) {
        if (k === '大主题') B.theme = v;
        else if (k === '关键概念') B.concepts = v.split(/[、,，/]\s*/).map(x => x.trim()).filter(Boolean);
        else if (mode === 'terms' && last && TERM_F[k]) setTermField(last, TERM_F[k], v);
        else if (last && last.role && EXP_F[k]) setExpField(last, EXP_F[k], v);
        else if (A && ARG_F[k]) setArgField(A, ARG_F[k], v);
        else B.unrec.push({ line: idx + 1, text: raw.trim() });
      }
      return;
    }
    if (mode === 'terms') {
      const { en, zh } = splitEnZh(body);
      if (en && /[A-Za-z]/.test(en)) { last = { en, zh, cat: '', pos: '', ex: '', exZh: '', verbs: [], ok: [], bad: [], mode: tm.mode }; B.terms.push(last); }
      else B.unrec.push({ line: idx + 1, text: raw.trim() });
      return;
    }
    if (A) {
      const r = body.match(ROLE_RE);
      if (r) {
        const { en, zh } = splitEnZh(r[2]);
        last = { role: r[1], en, zh, col: [], alt: [] };
        A.exps.push(last); return;
      }
      if (!A.en) { const { en, zh } = splitEnZh(body); if (en && /[A-Za-z]/.test(en)) { A.en = en; A.zh = zh; return; } }
    }
    B.unrec.push({ line: idx + 1, text: raw.trim() });
  });
  blocks.forEach(checkTopic);
  return { blocks, rest: rest.join('\n') };
}
function setArgField(A, k, v) {
  if (k === 'slots') A.pattern = Object.assign(A.pattern || {}, { slots: slashList(v) });
  else A.pattern = Object.assign(A.pattern || { slots: [] }, { apply: v });
}
function setExpField(E, k, v) {
  if (k === 'alt') E.alt = E.alt.concat(slashList(v));
  else if (k === 'col') E.col.push(v);
  else if (k === 'parts') E.parts = v.split(/\s*[|｜]\s*/).map(p => { const i = p.search(CJK); return i > 0 ? [p.slice(0, i).trim(), p.slice(i).trim()] : [p.trim(), '']; });
  else E[k] = v;
}
function setTermField(t, k, v) {
  if (k === 'ex') { const m = v.split(/\s*[/／]\s*(?=[^A-Za-z]*[㐀-鿿])/); t.ex = m[0].trim(); t.exZh = (m[1] || '').trim(); }
  else if (k === 'verbs') { const { en, zh } = splitEnZh(v); t.verbs.push([en, zh]); }
  else if (k === 'ok' || k === 'bad') t[k] = t[k].concat(slashList(v));
  else t[k] = v;
}

/* 检查一个话题：errors 必须改完原文才能导入，warns 只提醒 */
function checkTopic(B) {
  B.errors = []; B.warns = [];
  const old = [...T.topics].find(t => t.name === B.name);
  B.merge = old ? old.id : null;
  if (!B.merge && B.stances.length < 2) B.errors.push('新话题至少要两个立场（## 立场：……），选论点时要两边搭配');
  if (!B.merge && !B.theme) B.warns.push('没写“大主题”，先放在“我导入的话题”下面');
  const oldArgs = old ? old.args.map(id => T.arg.get(id)) : [];
  B.stances.forEach(s => s.args.forEach(A => {
    const where = `论点“${A.short}”`;
    A.skip = oldArgs.some(o => o.short === A.short || o.en === A.en);
    if (A.skip) { B.warns.push(`${where}已经有了，这次跳过`); return; }
    if (!A.en) B.errors.push(`${where}没有论点句（论点下面第一行写英文 + 中文）`);
    else if (!A.zh) B.warns.push(`${where}的论点句缺中文`);
    if (!A.exps.length) B.errors.push(`${where}没有展开表达（解释：/ 结果：/ 举例：……）`);
    if (!A.para) { B.errors.push(`${where}缺范文（复习的范文填空要用）`); return; }
    const low = A.para.toLowerCase();
    if (A.en && !low.includes(A.en.toLowerCase())) B.errors.push(`${where}的论点句在范文里找不到`);
    A.exps.forEach(e => {
      if (!e.en) B.errors.push(`${where}的“${e.role}”没有英文`);
      else if (!low.includes((e.para || e.en).toLowerCase())) B.errors.push(`${where}的“${e.en}”在范文里找不到（写法不一样时加一行“范文里写成：……”）`);
      if (e.en && !e.zh) B.warns.push(`“${e.en}”缺中文`);
    });
  }));
  const oldTerms = old ? old.terms.map(id => T.term.get(id).en.toLowerCase()) : [];
  B.terms.forEach(t => {
    t.skip = oldTerms.includes(t.en.toLowerCase());
    if (t.skip) B.warns.push(`话题词汇“${t.en}”已经有了，这次跳过`);
    else if (!t.zh) B.warns.push(`话题词汇“${t.en}”缺中文`);
  });
  if (B.unrec.length) B.errors.push(`${B.unrec.length} 行没认出来：${B.unrec.slice(0, 3).map(u => `第 ${u.line} 行`).join('、')}${B.unrec.length > 3 ? ' 等' : ''}`);
  const nArgs = B.stances.reduce((a, s) => a + s.args.filter(x => !x.skip).length, 0);
  // 整个话题都导入过（同一份文件补了别的内容再导入）：不算错，这次跳过它
  B.nothing = !nArgs && !B.terms.filter(t => !t.skip).length;
  if (B.nothing && !B.merge) B.errors.push('没有论点或话题词汇');
}

/* 链接词：范文里出现的功能表达，详情页里可以点进去 */
function autoLinks(para) {
  const low = para.toLowerCase();
  return FUNCTION_GROUPS.flatMap(g => g.items.map(x => fixedPart(x[0]))).filter(p => p.length > 3 && low.includes(p.toLowerCase())).slice(0, 4);
}
const cleanArg = A => ({ short: A.short, en: A.en, zh: A.zh, para: A.para.replace(/\s+/g, ' ').trim(), pattern: A.pattern && A.pattern.slots ? A.pattern : undefined, links: autoLinks(A.para),
  exps: A.exps.map(e => { const x = { role: e.role, en: e.en, zh: e.zh }; ['base', 'lead', 'usage', 'parts'].forEach(k => { if (e[k]) x[k] = e[k]; }); if (e.para) x.para = e.para; if (e.col.length) x.col = e.col; if (e.alt.length) x.alt = e.alt; return x; }) });
const cleanTerm = t => ({ en: t.en, zh: t.zh, cat: t.cat || '其他', pos: t.pos, ex: t.ex, exZh: t.exZh, verbs: t.verbs, ok: t.ok, bad: t.bad });

/* 把这次的话题并进 imp：新话题用草稿里定好的 id，预览和真正导入的 id 一样 */
function mergeBlocks(blocks, imp) {
  const modes = [];
  for (const B of blocks) {
    const stances = B.stances.map(s => ({ name: s.name, idea: s.idea, args: s.args.filter(a => !a.skip).map(cleanArg) })).filter(s => s.args.length || !B.merge);
    const terms = B.terms.filter(t => !t.skip);
    let tid = B.merge;
    if (tid) {
      const ext = imp.ext[tid] || (imp.ext[tid] = { stances: [], terms: [] });
      // 总是接在最后：同名立场也新加一段，已经导入过的论点编号不会变
      ext.stances.push(...stances);
      ext.terms.push(...terms.map(cleanTerm));
    } else {
      tid = B.newId || ('u' + uid());
      imp.topics.push({ id: tid, theme: B.theme || '我导入的话题', name: B.name, concepts: B.concepts, stances, terms: terms.map(cleanTerm) });
    }
    terms.forEach(t => modes.push([`tt:${tid}:${slug(t.en)}`, t.mode || setDefMode('term')]));
    B.tid = tid;
  }
  return modes;
}
function applyTopics(blocks) {
  const imp = S.t3.imp || (S.t3.imp = { topics: [], ext: {} });
  ui.impPreview = false;
  const modes = mergeBlocks(blocks, imp);
  t3assemble();
  modes.forEach(([id, m]) => { if (T.term.has(id) && m === 'memory') TR(id).mode = 'memory'; });
}
/* 导入前的预览：用草稿临时组一份 T，存档里的 imp 不动 */
function previewAssemble(D) {
  const real = S.t3.imp || { topics: [], ext: {} };
  S.t3.imp = JSON.parse(JSON.stringify(real));
  mergeBlocks(D.blocks, S.t3.imp);
  t3assemble();
  S.t3.imp = real;
  ui.impPreview = true;
  // 每个论点、词汇在预览里的 id
  for (const B of D.blocks) {
    const tp = T.topic.get(B.tid);
    const args = tp.args.map(a => T.arg.get(a));
    B.stances.forEach(s => s.args.forEach(A => { if (A.skip) return; const m = args.filter(x => x.en === A.en && x.short === A.short).pop(); A.pid = m && m.id; }));
    B.terms.forEach(t => { if (!t.skip) t.pid = `tt:${B.tid}:${slug(t.en)}`; });
  }
}
function endPreview() { if (ui.impPreview) { ui.impPreview = false; t3assemble(); } }
// 离开导入预览（去了别的页面）就把预览收掉，存档里没导入的话题不会出现在别处
const PREVIEW_VIEWS = new Set(['timport', 'impconfirm', 'targ', 'texp', 'tterm', 'tpara', 'edit']);
function impPreviewGuard() { if (ui.impPreview && !PREVIEW_VIEWS.has(cur().v)) endPreview(); }
const previewBanner = () => ui.impPreview ? `<div class="i-msg i-prev"><b>导入前的预览</b><span>这些内容还没有导入。可以点右上角“编辑”直接改，改的就是这次要导入的内容；确认导入后才会保存。</span><button class="btn btn-outline btn-sm" type="button" data-a="impback">回到导入预览</button></div>` : '';

/* ---------- 主题表达导入预览（第 41 节） ---------- */
function vTopicImport() {
  const D = S.t3.impDraft;
  if (!D) return { redirect: { v: 'import' } };
  const blocks = D.blocks;
  if (!ui.impPreview) previewAssemble(D);
  const plink = (id, html) => id ? `<button class="i-plink" type="button" data-go="${id}">${html}<span class="i-look">看详情页 ›</span></button>` : html;
  const errs = blocks.reduce((a, B) => a + B.errors.length, 0);
  const set = D.setId && noteSet(D.setId), nNotes = set ? S.notes.items.filter(i => i.setId === set.id).length : 0;
  const body = blocks.map(B => {
    const args = B.stances.map(s => `<div class="i-stance"><b>${esc(s.name)}</b>${s.idea ? `<small>${esc(s.idea)}</small>` : ''}${s.args.map(A => `<div class="i-arg ${A.skip ? 'skip' : ''}"><span class="i-short">论点 · ${esc(A.short)}${A.skip ? ' · 已有，跳过' : ''}</span>${plink(A.pid && 'targ:' + A.pid, `<span class="en">${esc(A.en || '（没有论点句）')}</span><small>${esc(A.zh)}</small>`)}
      ${A.exps.length ? `<div class="i-exps">${A.exps.map((e, k) => plink(A.pid && 'texp:' + A.pid + ':e' + (k + 1), `<span><i>${esc(e.role)}</i><span class="en">${esc(e.en)}</span> <small>${esc(e.zh)}</small></span>`)).join('')}</div>` : ''}
      <small class="${A.para ? 'muted' : 'i-bad'}">${A.para ? '范文 ' + A.para.split(/\s+/).length + ' 个词' : '缺范文'}</small></div>`).join('')}</div>`).join('');
    const terms = B.terms.length ? `<div class="i-stance"><b>话题词汇 · ${B.terms.length} 个</b><div class="chips">${B.terms.map(t => t.pid ? `<button class="chip" type="button" data-go="tterm:${t.pid}"><span class="en">${esc(t.en)}</span> ${esc(t.zh)}${t.mode === 'memory' ? ' · 记忆' : ''} ›</button>` : `<span class="chip muted"><span class="en">${esc(t.en)}</span> ${esc(t.zh)}</span>`).join('')}</div></div>` : '';
    return `<section class="i-topic">
      <div class="d-lab"><b>${B.merge ? '补进已有话题' : '新话题'}</b><i></i></div>
      <div class="i-head"><span class="en">${esc(B.name)}</span><small>${esc(B.theme || (B.merge ? T.topic.get(B.merge).theme : '我导入的话题'))}${B.concepts.length ? ' · ' + B.concepts.map(esc).join('、') : ''}</small></div>
      ${B.errors.length ? `<div class="i-msg bad"><b>要先改原文</b>${B.errors.map(e => `<span>· ${esc(e)}</span>`).join('')}${B.unrec.length ? `<span class="i-raw">${B.unrec.slice(0, 5).map(u => `第 ${u.line} 行：${esc(u.text)}`).join('<br>')}</span>` : ''}</div>` : ''}
      ${B.warns.length ? `<div class="i-msg"><b>提醒</b>${B.warns.map(e => `<span>· ${esc(e)}</span>`).join('')}</div>` : ''}
      ${args}${terms}</section>`;
  }).join('');
  return {

function runImport(text, title, source) {
  createNoteSet.skipped = 0;

  const same = P.blocks.filter(B => B.nothing && B.merge && !B.unrec.length);
  runImport.sameTopics = same.length;
  P.blocks = P.blocks.filter(B => !same.includes(B));
  if (same.length && (P.blocks.length || P.rest.trim())) toast(`话题“${same.map(B => B.name).join('、')}”都导入过了，这次跳过`);
  let setId = null;
  if (P.rest.trim()) setId = createNoteSet(P.rest, title, { source });
  P.blocks.forEach(B => { if (!B.merge) B.newId = 'u' + uid(); });
  const sp = setId ? splitFnSet(setId) : { fnSet: null, notesSet: null };
  const parts = (P.blocks.length ? ['topic'] : []).concat(sp.fnSet ? ['fn'] : [], sp.notesSet ? ['notes'] : []);
  if (parts.length >= 2) {
    ui.impPreview = false;
    S.t3.impDraft = P.blocks.length ? { blocks: P.blocks, setId: null, text, title } : null;
    const rec = addImportRec({ title, setIds: [sp.fnSet, sp.notesSet].filter(Boolean) });
    S.t3.impFlow = { parts, fnSet: sp.fnSet, notesSet: sp.notesSet, done: {}, tab: parts[0], recId: rec.id, title, text };
    assemble(); save(); replaceRoute({ v: 'impconfirm' }); return true;
  }
  if (P.blocks.length) { ui.impPreview = false; S.t3.impDraft = { blocks: P.blocks, setId, text, title }; assemble(); save(); replaceRoute({ v: 'timport' }); return true; }
  if (setId) { addImportRec({ title, setIds: [setId] }); assemble(); save(); replaceRoute({ v: 'triage', id: setId }); return true; }
  return false;
}

const lowIn = (hay, n) => !!n && String(hay).toLowerCase().includes(String(n).toLowerCase());

  }
  const left = F.parts.map(k => `${PART[k]} ${F.done[k] ? '✓' : flowProblem(F, k) ? `有 ${flowProblem(F, k)} 处要处理` : '待确认'}`).join(' · ');
  const curBad = !F.done[tab] && flowProblem(F, tab);
  return {
    title: '确认这次导入', crumb: ['导入', F.title],
    body: `<div class="f-tabs" role="tablist">${tabs}</div>
      <div class="f-body">${inner}</div>
      <div class="sticky-bar"><span class="summary">${left}</span>
        <div class="btn-row"><button class="btn btn-ghost btn-danger" type="button" data-a="impfcancel" data-confirm="确认放弃">放弃没确认的部分</button><button class="btn btn-outline" type="button" data-a="impfall">全部直接导入</button>${F.done[tab] ? '' : `<button class="btn btn-primary" type="button" data-a="impfok" data-k="${tab}" ${curBad ? 'disabled' : ''}>${curBad ? '先处理上面的问题' : '确认' + PART[tab]}</button>`}</div></div>`,
  };
}
function flowConfirm(F, k) {
  if (F.done[k] || flowProblem(F, k)) return false;
  const rec = (S.imports || []).find(x => x.id === F.recId);
  if (k === 'topic') {
    const D = S.t3.impDraft;
    endPreview();
    const before = new Set([...T.item.keys(), ...T.term.keys()]);
    applyTopics(D.blocks);
    if (rec) { rec.tids = D.blocks.map(B => B.tid); rec.ids = [...T.item.keys(), ...T.term.keys()].filter(x => !before.has(x)); }
    S.t3.impDraft = null;
  } else confirmSet(k === 'fn' ? F.fnSet : F.notesSet);
  F.done[k] = true;
  assemble();
  return true;
}
function flowNext(F) {
  const left = F.parts.filter(k => !F.done[k]);
  if (!left.length) { const id = F.recId; S.t3.impFlow = null; endPreview(); save(); replaceRoute({ v: 'impdone', id }); toast('这次导入的内容都已导入'); return; }
  F.tab = left[0]; save(); render(true);
}
function flowClick(a, el) {
  const F = S.t3.impFlow; if (!F) return false;
  if (a === 'impftab') { F.tab = el.dataset.k; save(); render(true); return true; }
  if (a === 'impfok') { if (flowConfirm(F, el.dataset.k)) { toast(PART[el.dataset.k] + '已导入'); flowNext(F); } return true; }
  if (a === 'impfall') {
    F.parts.forEach(k => flowConfirm(F, k));
    const bad = F.parts.filter(k => !F.done[k]);
    if (bad.length) { F.tab = bad[0]; save(); render(true); toast(`${bad.map(k => PART[k]).join('、')}还有问题，先处理再导入`); }
    else flowNext(F);
    return true;
  }
  if (a === 'impfcancel') {
    endPreview();
    if (!F.done.topic && F.parts.includes('topic')) S.t3.impDraft = null;
    if (F.fnSet && !F.done.fn) dropSet(F.fnSet);
    if (F.notesSet && !F.done.notes) dropSet(F.notesSet);
    const anyDone = F.parts.some(k => F.done[k]);
    const rec = (S.imports || []).find(x => x.id === F.recId);
    if (rec) { rec.setIds = recSets(rec).filter(id => noteSet(id)); if (!anyDone) S.imports = S.imports.filter(x => x !== rec); }
    S.t3.impFlow = null; assemble(); save();
    if (anyDone && rec) replaceRoute({ v: 'impdone', id: rec.id }); else replaceRoute({ v: 'import' });
    return true;
  }
  return false;
}

/* ============================================================
   配菜：功能表达 + 我的笔记（表达卡 · 句型卡 · 语法卡）
   今日学习时间线（复习 → 主菜 → 配菜）、编排设置（混合 / 轮换，按组）、
   挑选、配菜新学（同一组放一页看，再连着写）、配菜复习、挑战（不计分）
   ============================================================ */
const SD_CAT = { fn: { name: '功能表达', icon: 'fn' }, notes: { name: '我的笔记', icon: 'notes' } };
const SD_KIND = { fn: '功能表达', expr: '表达卡', pattern: '句型卡', grammar: '语法卡' };
const SD_METHOD = {
  fn: [['zh', '看中文'], ['ex', '在例句里']],
  expr: [['zh', '看中文'], ['ex', '在例句里']],
  pattern: [['zh', '看中文'], ['ex', '在例句里']],
  grammar: [['short', '改短句'], ['full', '改整句']],
};
const SD_TIER = ['次日', '3 天', '7 天', '14 天', '30 天'];
const sdCatOf = k => k === 'fn' ? 'fn' : 'notes';
const sdWord = k => k === 'fn' ? '条' : '张';
const sdMethodName = (k, m) => (SD_METHOD[k].find(x => x[0] === m) || SD_METHOD[k][0])[1];

function sd() {
  if (!S.side) S.side = {
    mode: 'rot', order: ['fn', 'notes'], on: { fn: true, notes: true }, ptr: 0,
    notes: { order: ['expr', 'pattern', 'grammar'], on: { expr: true, pattern: true, grammar: true }, ptr: 0 },
    g: { rot: 1, fn: 1, notes: 1 },
    method: { fn: 'zh', expr: 'zh', pattern: 'zh', grammar: 'short' },
    today: { day: '', list: null, cat: null, custom: false, done: false },
    learn: null, rev: null, revDone: null,
  };
  const D = S.side, k = dayKey();
  if (D.today.day !== k) {
    // 换了一天：昨天学了配菜，轮换才往后走
    if (D.today.done && D.today.list) {
      if (D.mode === 'rot' && D.today.cat) D.ptr = (D.order.indexOf(D.today.cat) + 1) % D.order.length;
      const nk = D.today.list.map(id => ITEMS.get(id)).filter(Boolean).map(sdKindOfItem).find(x => x !== 'fn');
      if (nk) D.notes.ptr = (D.notes.order.indexOf(nk) + 1) % D.notes.order.length;
    }
    D.today = { day: k, list: null, cat: null, custom: false, done: false };
    if (D.learn && D.learn.day !== k) D.learn = null;
    if (D.revDone && D.revDone.day !== k) D.revDone = null;
  }
  return D;
}
const sdKindOfItem = it => it.type === 'fn' ? 'fn' : it.type;
const sdKindOfGroup = G => G.lib === 'function' ? 'fn' : G.kind;
function sdGroups(k) {
  return [...GROUPS.values()].filter(G => (G.lib === 'function' || (G.lib === 'notes' && (noteSet(G.setId) || {}).confirmed)) && sdKindOfGroup(G) === k);
}
const sdMem = id => active(id) && modeOf(id) === 'memory';
// 一组就是一个单位；组里超过 6 张没学的，按原来的顺序分成几份
function sdUnits(k, taken = new Set()) {
  const out = [];
  sdGroups(k).forEach(G => {
    const ids = G.ids.filter(id => sdMem(id) && !studied(id) && !taken.has(id));
    for (let i = 0; i < ids.length; i += 6) out.push({ G, ids: ids.slice(i, i + 6) });
  });
  return out;
}
function sdNoteKind(nptr, taken) {
  const D = sd(), o = D.notes.order;
  for (let i = 0; i < o.length; i++) { const k = o[(nptr + i) % o.length]; if (D.notes.on[k] && sdUnits(k, taken).length) return k; }
  return null;
}
const sdCatKind = (cat, nptr, taken) => cat === 'fn' ? (sdUnits('fn', taken).length ? 'fn' : null) : sdNoteKind(nptr, taken);
function sdCatFrom(ptr, nptr, taken) {
  const D = sd();
  for (let i = 0; i < D.order.length; i++) { const c = D.order[(ptr + i) % D.order.length]; if (D.on[c] && sdCatKind(c, nptr, taken)) return c; }
  return null;
}
function sdRecommend() {
  const D = sd();
  let ids = [], cat = null;
  if (D.mode === 'rot') { cat = sdCatFrom(D.ptr, D.notes.ptr); if (cat) ids = sdUnits(sdCatKind(cat, D.notes.ptr)).slice(0, D.g.rot).flatMap(u => u.ids); }
  else D.order.forEach(c => { if (!D.on[c]) return; const k = sdCatKind(c, D.notes.ptr); if (k) ids.push(...sdUnits(k).slice(0, D.g[c]).flatMap(u => u.ids)); });
  return { ids, cat };
}
function sdList() {
  const D = sd();
  // 今天还是空的（比如今天才第一次导入）就重新推荐；排好了就不再变
  const empty = D.today.list && !D.today.list.length && !D.today.custom && !D.today.done && !D.learn;
  if (!D.today.list || empty) { const r = sdRecommend(); if (!D.today.list || r.ids.length) { Object.assign(D.today, { list: r.ids, cat: r.cat, custom: false }); save(); } }

}
const sdKinds = () => sd().order.flatMap(c => c === 'fn' ? ['fn'] : sd().notes.order);
const sdGroupOrder = () => sdKinds().flatMap(sdGroups);
const sdSort = ids => sdGroupOrder().flatMap(G => G.ids.filter(id => ids.includes(id)));
const sdByGroup = ids => sdGroupOrder().map(G => ({ G, k: sdKindOfGroup(G), ids: G.ids.filter(id => ids.includes(id)) })).filter(u => u.ids.length);
const sdDue = () => sdSort([...ITEMS.keys()].filter(id => { const it = ITEMS.get(id); return (it.lib === 'function' || it.lib === 'notes') && (isDue(id) || spSideDue(id)); }));

  const D = sd(), rows = [], taken = new Set(D.today.done ? [] : sdList());

  if (D.mode === 'rot' && D.today.cat) ptr = (D.order.indexOf(D.today.cat) + 1) % D.order.length;
  const tk = sdList().map(id => sdKindOfItem(ITEMS.get(id))).find(k => k !== 'fn'); if (tk) nptr = (D.notes.order.indexOf(tk) + 1) % 3;
  for (let d = 1; d <= 7; d++) {
    const r = { t: addDays(Date.now(), d), n: {}, names: {} };
    const take = (cat, gN) => { const k = sdCatKind(cat, nptr, taken); if (!k) return; const us = sdUnits(k, taken).slice(0, gN); us.flatMap(u => u.ids).forEach(id => taken.add(id)); r.n[cat] = us.reduce((a, u) => a + u.ids.length, 0); r.names[cat] = (cat === 'notes' ? SD_KIND[k] + ' · ' : '') + us.map(u => u.G.name).join('、'); if (cat === 'notes') nptr = (D.notes.order.indexOf(k) + 1) % 3; };
    if (D.mode === 'rot') { const c = sdCatFrom(ptr, nptr, taken); if (c) { take(c, D.g.rot); ptr = (D.order.indexOf(c) + 1) % D.order.length; } }
    else D.order.forEach(c => { if (D.on[c]) take(c, D.g[c]); });
    rows.push(r);
  }
  return rows;
}

/* ---------- 共享片段 ---------- */
const sdIco = (k, cls = '') => `<span class="s-ico ${cls}">${svg(k)}</span>`;
const sdKindLabel = k => k === 'fn' ? '功能表达' : '我的笔记 · ' + SD_KIND[k];
const sdGName = G => G.lib === 'function' ? G.fn : (G.ids.length < 2 ? '独立卡片' : G.name);
const sdDetail = id => `<button class="t-link-btn" type="button" data-go="item:${esc(id)}">看详情页 ›</button>`;
const sdSeg = (act, opts, cur, extra = '') => `<span class="seg small" role="group">${opts.map(([v, t]) => `<button type="button" data-a="${act}" data-v="${v}" ${extra} aria-pressed="${v === cur}">${t}</button>`).join('')}</span>`;
// 按大类分区、每组一张卡
function sdSections(units, headRight, rowOf, grid) {
  return sd().order.filter(c => units.some(u => sdCatOf(u.k) === c)).map(c => {
    const us = units.filter(u => sdCatOf(u.k) === c), n = us.reduce((a, u) => a + u.ids.length, 0);
    return `<div class="s-cat"><div class="s-cat-h">${sdIco(SD_CAT[c].icon)}${SD_CAT[c].name}<small>${us.length} 组 · ${n} ${c === 'fn' ? '条' : '张'}</small></div>
      <div class="${grid ? 's-gcards' : 's-gcards1'}">${us.map(u => `<div class="s-gcard"><div class="s-gcard-h">${c === 'notes' ? `<span class="s-kchip">${SD_KIND[u.k]}</span>` : ''}<b>${esc(sdGName(u.G))}</b><span class="r">${headRight(u)}</span></div>${u.ids.map(rowOf).join('')}</div>`).join('')}</div></div>`;
  }).join('');
}
// 顶部一行紧凑进度：当前这组 + 小圆点；点开看全部
function sdProg(ses, doneAll) {
  const st = i => doneAll || i < ses.ui ? 'done' : (i === ses.ui ? 'cur' : '');
  const u = ses.units[Math.min(ses.ui, ses.units.length - 1)];
  const cats = sd().order.filter(c => ses.units.some(x => sdCatOf(x.k) === c));
  const dots = cats.map(c => `<span class="s-dots">${ses.units.map((x, i) => sdCatOf(x.k) !== c ? '' : `<i class="${st(i)}"></i>`).join('')}</span>`).join('<span class="s-dsep"></span>');
  const cur = doneAll ? '<b>全部完成</b>' : `${svg(SD_CAT[sdCatOf(u.k)].icon)}<span class="muted">${SD_CAT[sdCatOf(u.k)].name}</span>${u.k !== 'fn' ? `<span class="s-kchip">${SD_KIND[u.k]}</span>` : ''}<b>${esc(sdGName(u.G))}</b><span class="muted">第 ${ses.ui + 1} / ${ses.units.length} 组</span>`;
  const full = cats.map(c => `<div class="s-pcat"><span class="s-pcat-h">${svg(SD_CAT[c].icon)}${SD_CAT[c].name}</span><div class="s-psegs">${ses.units.map((x, i) => sdCatOf(x.k) !== c ? '' : `<span class="s-pseg ${st(i)}">${x.k !== 'fn' ? `<span class="tk">${SD_KIND[x.k]}</span>` : ''}${esc(sdGName(x.G))}<span class="n">${st(i) === 'done' ? '✓' : x.ids.length}</span></span>`).join('')}</div></div>`).join('');
  return `<details class="s-prog"><summary><span class="s-pnow">${cur}</span><span class="s-pdots">${dots}</span><span class="s-pmore">全部 ▾</span></summary><div class="s-pfull">${full}</div></details>`;
}

/* ---------- 今日学习：时间线（复习 → 主菜 → 配菜） ---------- */
function vTodaySide() {
  if (libEmpty()) return { title: '今日学习', crumb: [fmtMD(Date.now())], body: emptyLibHTML() };
  const D = sd(), ids = sdList();
  const P = t3plan(), pend = t3Pend(), sdue = sdDue();
  const oldQ = dueQueue(), oldN = oldQ.reduce((a, g) => a + g.ids.length, 0);
  const reviewDone = !P.n && !S.t3.rev && !pend.length && !sdue.length && !D.rev && !oldN;
  const tl = S.t3.learn, topicBusy = tl && tl.step !== 'done';
  const topicDone = !topicBusy && S.t3.combos.some(c => dayKey(c.created) === dayKey());
  const sideDone = D.today.done || (!ids.length && !D.learn);
  const sp = spActive(), paused = spPaused() && !topicBusy && !D.learn;
  const pz = [false, paused, paused];
  const steps = [reviewDone, topicDone || paused, sideDone || paused];
  const doneN = steps.filter((x, i) => x && !pz[i]).length, curStep = steps.findIndex(x => !x), totN = paused ? 1 : 3;
  const mins = Math.round((P.n + sdue.length + oldN) * 0.9 + (topicDone ? 0 : 22) + (sideDone ? 0 : ids.length * 1.3));
  const tlRow = (i, title, sub, right, inner = '') => `<div class="s-tl ${steps[i] ? 'done' : ''} ${pz[i] ? 'paused' : ''}"><div class="rail"><span class="s-dot ${pz[i] ? 'paused' : steps[i] ? 'done' : (i === curStep ? 'cur' : '')}">${pz[i] ? '–' : steps[i] ? svg('check', 2.4) : i + 1}</span><span class="line"></span></div>
    <div class="body"><div class="title"><h3>${title}</h3><span class="note-line">${sub}</span><span class="r">${right}</span></div>${inner}</div></div>`;
  const doneTag = '<span class="note-line" style="color:var(--sage-deep)">已完成</span>';
  // ① 复习：主题表达 + 配菜
  const revRow = (icon, name, sub, btn) => `<div class="s-revrow">${sdIco(icon)}<span class="txt"><b>${name}</b><small>${sub}</small></span>${btn}</div>`;
  let topicBtn;
  if (S.t3.rev) topicBtn = `<button class="btn btn-primary btn-sm" type="button" data-a="t3resumerev">继续</button>`;
  else if (P.n) topicBtn = `<button class="btn ${curStep === 0 ? 'btn-primary' : 'btn-outline'} btn-sm" type="button" data-a="t3startall">开始</button>`;
  else topicBtn = S.t3.revDone ? `<button class="btn btn-ghost btn-sm" type="button" data-go="trevdone">看结果</button>` : '';
  let sideBtn;
  if (D.rev) sideBtn = `<button class="btn btn-primary btn-sm" type="button" data-go="srev">继续</button>`;
  else if (sdue.length) sideBtn = `<button class="btn ${curStep === 0 && !P.n ? 'btn-primary' : 'btn-outline'} btn-sm" type="button" data-go="splan">开始</button>`;
  else sideBtn = D.revDone ? `<button class="btn btn-ghost btn-sm" type="button" data-go="srevdone">看结果</button>` : '';
  const revInner = `<div class="s-card s-revcard">
    ${pend.length ? `<div class="s-revrow warn"><span class="txt"><b>${pend.length} 个论点评为忘记，等你确认是否从头开始</b><small>确认后才能打卡</small></span><button class="btn btn-outline btn-sm" type="button" data-go="trevdone">去确认</button></div>` : ''}
    ${revRow('topic', '主题表达', S.t3.rev ? '复习进行中，退出时已保存位置' : P.n ? `补练 ${P.mk.length} · 论点 ${P.args.length} 个 · 话题词汇 ${P.terms.length} · 共 ${P.n} 条` : '今天没有到期的', topicBtn)}
    ${P.n && !S.t3.rev ? `<details class="s-tplan"><summary>看主题表达的复习计划 ▾</summary><div class="s-tplan-in">${t3PlanHTML()}</div></details>` : ''}
    ${revRow('notes', '配菜 · 功能表达和我的笔记', D.rev ? '复习进行中，退出时已保存位置' : sdue.length ? `${sdByGroup(sdue).length} 组 · ${sdue.length} 条` : '今天没有到期的', sideBtn)}
    ${oldN ? revRow('library', '上一版的表达组', `${oldN} 条`, `<button class="btn btn-outline btn-sm" type="button" data-a="startreview">开始</button>`) : ''}
  </div>`;
  // ③ 配菜
  const units = sdByGroup(ids);
  const rows = units.map(u => `<div class="s-ghead">${sdIco(SD_CAT[sdCatOf(u.k)].icon)}<b>${esc(sdGName(u.G))}</b><span class="note-line">${sdKindLabel(u.k)} · ${u.ids.length} ${sdWord(u.k)}${u.ids.length < u.G.ids.length ? `（这组共 ${u.G.ids.length}）` : ''}</span></div>` + u.ids.map(id => { const it = ITEMS.get(id); return `<button class="s-srow" type="button" data-go="item:${esc(id)}"><span class="en">${esc(it.en)}</span><small>${esc(it.zh)}</small></button>`; }).join('')).join('');
  const nk = units.map(u => u.k).find(k => k !== 'fn');
  let sideTitle;
  if (D.today.custom) sideTitle = '配菜 · 自己挑的';
  else if (D.mode === 'rot') sideTitle = D.today.cat ? `配菜 · 今天轮到${SD_CAT[D.today.cat].name}${D.today.cat === 'notes' && nk ? '（' + SD_KIND[nk] + '）' : ''}` : '配菜';
  else sideTitle = '配菜 · 功能表达 + 我的笔记';
  const nextCat = D.mode === 'rot' && D.today.cat ? sdCatFrom((D.order.indexOf(D.today.cat) + 1) % 2, D.notes.ptr, new Set(ids)) : null;
  const chips = D.mode === 'rot' ? D.order.map(c => `<span class="s-chip ${c === D.today.cat ? 'on' : ''}">${svg(SD_CAT[c].icon)}${SD_CAT[c].name}${c === D.today.cat ? ' · 今天' : c === nextCat ? ' · 明天' : ''}</span>`).join('') : '';
  const foot = `<div class="s-foot"><span>编排：${D.mode === 'rot' ? `轮换 · 每天 ${D.g.rot} 组` : `混合 · 功能表达 ${D.g.fn} 组、我的笔记 ${D.g.notes} 组`}</span>${chips}${D.today.custom ? '<span class="s-chip on">你自己挑的</span><button class="t-link-btn" type="button" data-a="sdpickreset">恢复推荐</button>' : ''}<button class="t-link-btn" style="margin-left:auto" type="button" data-go="sset">改编排 ›</button></div>`;
  let sideRight;
  if (D.today.done) sideRight = doneTag;
  else if (D.learn) sideRight = `<button class="btn btn-primary" type="button" data-go="slearn">继续</button>`;
  else sideRight = `<span class="btn-row"><button class="btn btn-outline" type="button" data-a="sdpick">挑选</button>${ids.length ? `<button class="btn ${curStep === 2 ? 'btn-primary' : 'btn-outline'}" type="button" data-a="sdlstart">开始</button>` : ''}</span>`;
  const sideInner = `<div class="s-card">${rows || `<p class="note-line" style="margin:6px 0">${D.today.done ? '今天的配菜已经学完了。' : '没有排配菜：设为“记忆”、还没学的卡都学完了。可以点“挑选”自己选，资料也能选进来。'}</p>`}${foot}</div>`;
  const oldNew = S.newSession ? `<div class="row" style="background:var(--paper)"><div class="body"><span class="title">上一版的新学还没做完 · ${esc((GROUPS.get(S.newSession.gid) || {}).name || '')}</span><span class="meta">v4 的新学流程，继续做完或放弃</span></div><div class="btn-row"><button class="btn btn-ghost btn-sm btn-danger" type="button" data-a="dropnew" data-confirm="确认放弃">放弃</button><button class="btn btn-outline btn-sm" type="button" data-a="resumenew">继续</button></div></div>` : '';
  const ck = steps.every(Boolean) && canCheckin();
  return {
    title: '今日学习', crumb: [fmtMD(Date.now())],
    body: `<div class="s-wrap">
      <div class="s-progress"><b>今天大约 ${mins} 分钟</b><span class="bar"><i style="width:${doneN / totN * 100}%"></i></span><span class="note-line" style="color:var(--sage-deep)">已完成 ${doneN} / ${totN}</span></div>
      ${spBannerHTML()}
      ${oldNew}
      <div class="s-tls">
      ${tlRow(0, sp ? '冲刺复习' : '今日复习', reviewDone ? '' : sp ? '今天分到的，加上本来今天到期的' : '主题表达 + 配菜，按到期时间排', reviewDone ? doneTag : '', revInner)}
      ${paused ? tlRow(1, '主菜 · 主题表达', '冲刺期间暂停', '', spPausedCard('考前不学新的话题，把学过的复习牢。')) : tlRow(1, '主菜 · 主题表达', '一次一个写作组合（3 个论点，约 12 条）', topicDone ? doneTag : '', `<div class="s-card s-main">${t3TodayNew()}</div>`)}
      ${paused ? tlRow(2, '配菜', '冲刺期间暂停', '', spPausedCard('功能表达、我的笔记也先不学新的。')) : tlRow(2, sideTitle, ids.length ? `${ids.length} 条 · 约 ${Math.max(2, Math.round(ids.length * 1.3))} 分钟` : '', sideRight, sideInner)}
      </div>
      ${ck ? `<div class="btn-row"><button class="btn btn-primary" type="button" data-a="checkin">完成今天的学习并打卡</button></div>` : ''}
    </div>`,
  };
}

/* ---------- 编排设置 ---------- */
function vSideSet() {
  const D = sd(), rot = D.mode === 'rot';
  const pic = r => `<span class="s-pic">${[0, 1, 2, 3].map(d => `<span><span class="cells">${[0, 1, 2].map(i => `<i class="${i === 0 ? 't' : ((!r || i === 1 + d % 2) ? 'o' : '')}"></i>`).join('')}</span>第 ${d + 1} 天</span>`).join('')}</span>`;
  const stepper = (a, v, k = '') => `<span class="s-stepper"><button type="button" data-a="${a}" data-k="${k}" data-d="-1" aria-label="减少">−</button><b>${v}</b><button type="button" data-a="${a}" data-k="${k}" data-d="1" aria-label="增加">+</button></span>`;
  const chk = (a, k, on) => `<button class="s-check" type="button" data-a="${a}" data-k="${k}" aria-pressed="${on}" aria-label="参加">${on ? svg('check', 2.6) : ''}</button>`;

  const counts = rot
    ? `<div class="s-krow"><span></span>${sdIco('topic')}<b>主题表达</b><small>每天一个写作组合（3 个论点）</small><span></span></div>
       <div class="s-krow"><span></span>${sdIco('today')}<b>轮到的那一类</b><small>每天只学这一类，整组学</small><span>${stepper('sdg', D.g.rot, 'rot')}<span class="unit">组</span></span></div>`
    : `<div class="s-krow"><span></span>${sdIco('topic')}<b>主题表达</b><small>每天一个写作组合（3 个论点）</small><span></span></div>
       ${D.order.map(c => `<div class="s-krow ${D.on[c] ? '' : 'off'}">${chk('sdcaton', c, D.on[c])}${sdIco(SD_CAT[c].icon)}<b>${SD_CAT[c].name}</b><small>每天都有</small><span>${stepper('sdg', D.g[c], c)}<span class="unit">组</span></span></div>`).join('')}`;
  const wk = sdWeek(), first = wk[0];

  const sum = rot ? wk.slice(0, 4).map((r, i) => { const c = Object.keys(r.n)[0]; return `<span><small>${['明天', '后天'][i] || '周' + WD[new Date(r.t).getDay()]}</small>${c ? svg(SD_CAT[c].icon) + esc(r.names[c]) : '没有新卡'}</span>`; }).join('')
    : D.order.filter(c => D.on[c] && first && first.n[c]).map(c => `<span>${svg(SD_CAT[c].icon)}${esc(first.names[c])} <b>${first.n[c]}</b></span>`).join('');
  return {
    title: '每天新学怎么编排', crumb: ['设置'],
    body: `<div class="s-wrap">
      <p class="warm" style="margin:0;max-width:72ch">主题表达每天都学。配菜分两类：功能表达、我的笔记（表达卡、句型卡、语法卡）。可以每天两类都学一点（混合），也可以一天只学一类、第二天换另一类（轮换）。都按组学，一组 2–6 张。</p>

        <button class="s-mode" type="button" data-a="sdmode" data-v="rot" aria-pressed="${rot}"><span class="r"><span class="radio"></span><b>轮换（默认）</b></span><small>主题表达每天都有，功能表达和我的笔记一天一类，轮着来</small>${pic(true)}</button>
      </div>
      <section class="s-card"><b class="s-h">每天学几组</b>${counts}
        <div class="s-orders">
          <div class="s-oh"><b>顺序</b><small>新学、复习都按这个顺序${rot ? '；轮换也按这个顺序轮' : ''}</small></div>
          <div class="s-order">${chips(D.order, D.on, 'sdcat', c => SD_CAT[c].name, c => svg(SD_CAT[c].icon))}</div>
          <div class="s-oh"><b>我的笔记里轮着挑</b><small>学“我的笔记”的那天，按这个顺序挑一种的组</small></div>
          <div class="s-order">${chips(D.notes.order, D.notes.on, 'sdnk', k => SD_KIND[k], () => '', k => sdUnits(k).length + ' 组没学')}</div>
        </div></section>
      <div class="s-summary"><b>明天 ${tomorrowN} 条配菜</b><span class="items">${sum || '没有可学的新卡'}</span><button class="t-link-btn" type="button" data-a="sdweek">查看未来 7 天安排 ›</button></div>
      <section class="s-card"><b class="s-h">默写方式</b><small class="note-line">每组开始默写时也可以换，下次会记住你最后选的。</small>
        <div class="s-mgrid">${['fn', 'expr', 'pattern', 'grammar'].map(k => `<div><b>${SD_KIND[k]}</b>${sdSeg('sdsetm', SD_METHOD[k], D.method[k], `data-k="${k}"`)}</div>`).join('')}</div></section>
      <p class="note-line">只有设为“记忆”的卡会排进新学；“资料”只在详情页看（挑选时也能选进来），“暂缓”先放着，已有的复习进度保留。改了设置，今天还没开始的配菜会按新的排。</p>
      ${ui.sdWeek ? sdWeekModal(wk) : ''}
    </div>`,
  };
}
function sdWeekModal(wk) {

  return `<div class="s-scrim" data-a="sdweekclose"><div class="s-sheet" role="dialog" aria-label="未来 7 天的新学安排" data-a="sdnoop">
    <div class="s-sheet-h"><div><h3>未来 7 天的新学安排</h3><span class="note-line">编排：${D.mode === 'rot' ? '轮换' : '混合'} · 按现在的设置和还没学的卡算出来</span></div><button class="icon-btn" type="button" data-a="sdweekclose" aria-label="关闭">×</button></div>
    <div class="s-week-wrap"><div class="s-week"><span></span><span class="h">${svg('topic')}主题表达</span>${D.order.map(c => `<span class="h">${svg(SD_CAT[c].icon)}${SD_CAT[c].name}</span>`).join('')}
    ${wk.map(r => `<span class="d">${fmtMD(r.t)} 周${WD[new Date(r.t).getDay()]}</span><span class="c t">3 个论点</span>${D.order.map(c => cell(r.n[c] || 0, r.names[c])).join('')}`).join('')}</div></div>
    <p class="note-line">某一类没有新卡了会跳过；哪天没学配菜，轮换顺序不往后走。</p></div></div>`;
}

/* ---------- 挑选今天的配菜 ---------- */

      <p class="warm" style="margin:0">系统推荐的已经勾好。可以整组勾，也可以只勾组里的几张。“资料”也能选，选了会改成“记忆”；学过的卡灰着，不能再选。点英文看详情页。</p>
      <span class="seg small" role="tablist" style="align-self:flex-start;flex-wrap:wrap">${sdKinds().map(x => { const c = [...sel].filter(id => sdKindOfItem(ITEMS.get(id)) === x).length; return `<button type="button" data-a="sdpkind" data-v="${x}" aria-pressed="${x === k}">${x === 'fn' ? '功能表达' : '笔记 · ' + SD_KIND[x]}${c ? ' · ' + c : ''}</button>`; }).join('')}</span>

          ${G.ids.filter(active).map(id => { const it = ITEMS.get(id), m = modeOf(id), s = S.items[id]; const right = studied(id) ? `已学 · ${SD_TIER[Math.min(s.stage || 0, 4)]}档` : m === 'reference' ? '资料' : m === 'paused' ? '暂缓' : ''; return `<div class="s-pr ${can(id) ? '' : 'off'}"><button class="s-check" type="button" data-a="sdpone" data-id="${esc(id)}" aria-pressed="${sel.has(id)}" ${can(id) ? '' : 'disabled'} aria-label="选这一张">${sel.has(id) ? svg('check', 2.6) : ''}</button><button class="s-plink" type="button" data-go="item:${esc(id)}"><span class="en">${esc(it.en)}</span><small>${esc(it.zh)}</small></button><small class="muted">${right}</small></div>`; }).join('')}</div>`; }).join('')
        : `<div class="empty"><h3>这一种还没有卡</h3><p>导入笔记、确认整理后会出现在这里。</p><button class="btn btn-soft" type="button" data-go="import">导入</button></div>`}
      <div class="sticky-bar"><span class="summary">已选 <b>${n}</b> 条${per.length ? ' · ' + per.map(([x, c]) => SD_KIND[x] + ' ' + c).join(' · ') : ''}${n ? ' · 约 ' + Math.max(2, Math.round(n * 1.3)) + ' 分钟' : ''}</span>
        <div class="btn-row"><button class="btn btn-ghost" type="button" data-a="sdprec">恢复推荐</button><button class="btn btn-primary" type="button" data-a="sdpok">确定</button></div></div>
    </div>`,
  };
}

/* ---------- 默写题 ---------- */
function sdGrammarShort(it) {
  const w = String(it.wrong || '').trim(), r = String(it.en || '').trim();
  if (!w) return { box: '', ans: r };
  const ww = w.split(/\s+/), rw = r.split(/\s+/);

/* ============================================================
   考前冲刺（设计稿 CX、CY）：考前最后 7 天，把所有在记的内容至少复习一遍，平均分到这 7 天
   - 冲刺开始那天把 7 天的安排定下来（S.t3.sprintPlan），之后不随评分变动
   - 每天分到的内容算作“今天到期”，和本来到期的一起出现在今日复习里，不会重复
   - 默认冲刺期间暂停新学；最后一天只复习薄弱的
   ============================================================ */
function spSet() {
  const s = S.t3.set;
  if (s.sprint == null) s.sprint = false;
  if (!s.sprintNew) s.sprintNew = 'pause';
  if (!s.sprintLast) s.sprintLast = 'weak';
  return s;
}
function spWindow() {
  const ex = examTs(); if (!ex) return null;
  const start = addDays(ex, -7);
  return { ex, start, days: [0, 1, 2, 3, 4, 5, 6].map(i => addDays(start, i)) };
}
function spActive() {
  const s = spSet(), w = spWindow();
  if (!s.sprint || !w) return null;
  const t = dayStart();
  if (t < w.start || t >= w.ex) return null;
  return Object.assign(w, { n: w.days.indexOf(t) + 1, left: diffDays(w.ex) });
}
const spWeakR = r => r === 'vag' || r === 'fgt';
// 要冲刺的单位：主题表达按写作组合、话题词汇按个、配菜按组
function spUnits() {
  const out = [], seen = new Set();
  for (const id of T.arg.keys()) {
    const r = S.t3.arg[id];
    if (!r || r.mode !== 'memory' || r.stage == null || seen.has(id)) continue;
    const c = comboOf(id), ids = (c ? c.args : [id]).filter(a => { const x = S.t3.arg[a]; return T.arg.has(a) && x && x.mode === 'memory' && x.stage != null; });
    ids.forEach(a => seen.add(a));
    const A0 = T.arg.get(ids[0]), tp = T.topic.get(A0.topic);
    out.push({ key: 'c:' + ids[0], kind: 'arg', ids, n: ids.reduce((s, a) => s + T.arg.get(a).items.length, 0), weak: ids.some(a => spWeakR(S.t3.arg[a].lastR)), last: Math.max(...ids.map(a => S.t3.arg[a].last || 0)), name: tp.name + ' · ' + ids.map(a => '论点 ' + T.arg.get(a).n).join('、') });
  }
  for (const id of T.term.keys()) {
    const r = S.t3.term[id];
    if (!r || r.mode !== 'memory' || r.stage == null) continue;
    out.push({ key: 't:' + id, kind: 'term', ids: [id], n: 1, weak: spWeakR(r.lastR), last: r.last || 0, name: T.term.get(id).en });
  }
  const gmap = new Map();
  for (const [id, it] of ITEMS) {
    if (!(it.lib === 'function' || it.lib === 'notes') || !active(id) || modeOf(id) !== 'memory' || !studied(id)) continue;
    if (!gmap.has(it.gid)) gmap.set(it.gid, []);
    gmap.get(it.gid).push(id);
  }
  const lastR = id => { const h = (S.items[id] || {}).hist || []; return (h[h.length - 1] || {}).r; };
  for (const [gid, ids] of gmap) {
    const G = GROUPS.get(gid); if (!G) continue;
    out.push({ key: 'g:' + gid, kind: G.lib === 'function' ? 'fn' : 'notes', ids, n: ids.length, weak: ids.some(x => spWeakR(lastR(x))), last: Math.max(...ids.map(x => S.items[x].last || 0)), name: sdGName(G) });
  }
  return out;
}
// 排 7 天：薄弱的、很久没复习的在前，最近 3 天刚复习过的往后；每次放进目前最轻的一天
function spMake() {
  const w = spWindow(); if (!w) return null;
  const s = spSet(), units = spUnits(), recent = addDays(Date.now(), -3);
  units.sort((a, b) => (b.weak - a.weak) || ((a.last >= recent) - (b.last >= recent)) || (a.last - b.last));
  const days = w.days.map(t => ({ t, keys: [], n: 0 }));
  const weakLast = s.sprintLast === 'weak';
  // 冲刺中途才打开：只排今天和以后的几天
  const from = Math.max(0, Math.min(6, w.days.indexOf(dayStart())));
  let pool = (weakLast ? days.slice(0, 6) : days).slice(from);
  if (!pool.length) pool = [days[6]];
  units.forEach(u => { const d = pool.reduce((m, x) => x.n < m.n ? x : m, pool[0]); d.keys.push(u.key); d.n += u.n; });
  if (weakLast) units.filter(u => u.weak).forEach(u => { days[6].keys.push(u.key); days[6].n += u.n; });
  const byKey = {}; units.forEach(u => { byKey[u.key] = { kind: u.kind, ids: u.ids, n: u.n, name: u.name, weak: u.weak }; });
  return { exam: S.t3.set.exam, last: s.sprintLast, start: w.start, days, units: byKey, total: units.reduce((a, u) => a + u.n, 0) };
}
// 冲刺开始后定下来；改了考试日期或“最后一天”设置才重排
function spPlan() {
  const a = spActive();
  if (!a) return spMake();
  const P = S.t3.sprintPlan;
  if (!P || P.exam !== S.t3.set.exam || P.last !== S.t3.set.sprintLast) { S.t3.sprintPlan = spMake(); save(); }
  return S.t3.sprintPlan;
}
// 今天分到、冲刺里还没复习过的条目（最后一天的薄弱项照样再复习）
let spCache = { k: '', v: null };
function spToday() {
  const a = spActive();
  if (!a) return null;
  const k = dayKey() + ':' + (S.t3.sprintPlan ? S.t3.sprintPlan.total : '') + ':' + S.t3.set.exam + ':' + S.t3.set.sprintLast;
  if (spCache.k === k && spCache.v) return spCache.v;
  const P = spPlan(), d = P.days[a.n - 1], lastDay = a.n === 7;
  const v = { arg: new Set(), term: new Set(), side: new Set(), start: P.start, lastDay };
  (d ? d.keys : []).forEach(key => { const u = P.units[key]; if (!u) return; const set = u.kind === 'arg' ? v.arg : u.kind === 'term' ? v.term : v.side; u.ids.forEach(id => set.add(id)); });
  spCache = { k, v };
  return v;
}
function spNeed(rec, v) { return !!rec && rec.mode !== 'paused' && (rec.last || 0) < dayStart() && (v.lastDay || (rec.last || 0) < v.start); }
function spArgDue(id) { const v = spToday(); return !!v && v.arg.has(id) && spNeed(S.t3.arg[id], v); }
function spTermDue(id) { const v = spToday(); return !!v && v.term.has(id) && spNeed(S.t3.term[id], v); }
function spSideDue(id) { const v = spToday(); return !!v && v.side.has(id) && active(id) && spNeed(S.items[id], v); }
const spPaused = () => !!spActive() && spSet().sprintNew === 'pause' && !ui.spLearn;
// 冲刺还剩多少（今天和以后分到、冲刺里还没复习过的）
function spLeft() {
  const a = spActive(); if (!a) return 0;
  const P = spPlan(), seen = new Set(); let n = 0;
  P.days.slice(a.n - 1).forEach(d => d.keys.forEach(key => {
    const u = P.units[key]; if (!u || seen.has(key)) return; seen.add(key);
    u.ids.forEach(id => { const rec = u.kind === 'arg' ? S.t3.arg[id] : u.kind === 'term' ? S.t3.term[id] : S.items[id]; if ((rec && rec.last || 0) < P.start) n += u.kind === 'arg' ? T.arg.get(id).items.length : 1; });
  }));
  return n;
}

/* ---------- 图：7 天每天多少 ---------- */
function spBars(P, todayIdx) {
  const per = P.days.map(d => { const c = { arg: 0, term: 0, side: 0 }; d.keys.forEach(k => { const u = P.units[k]; if (u) c[u.kind === 'arg' ? 'arg' : u.kind === 'term' ? 'term' : 'side'] += u.n; }); return c; });
  const mx = Math.max(1, ...per.map(c => c.arg + c.term + c.side));
  return `<div class="sp-bars">${P.days.map((d, i) => { const c = per[i], tot = c.arg + c.term + c.side, h = v => Math.round(v / mx * 110); return `<div class="sp-col ${i === todayIdx ? 'on' : ''} ${todayIdx != null && i < todayIdx ? 'past' : ''}"><b>${tot}</b><span class="sp-stack"><i class="side" style="height:${h(c.side)}px"></i><i class="term" style="height:${h(c.term)}px"></i><i class="arg" style="height:${h(c.arg)}px"></i></span><small>${fmtMD(d.t).replace(' 月 ', '/').replace(' 日', '')}</small><small class="muted">周${WD[new Date(d.t).getDay()]}${i === 6 && P.last === 'weak' ? ' · 薄弱' : ''}</small></div>`; }).join('')}</div>
    <div class="sp-legend"><span><i class="arg"></i>主题表达论点</span><span><i class="term"></i>话题词汇</span><span><i class="side"></i>配菜</span><span class="muted" style="margin-left:auto">当天本来到期的照常出现，不会重复</span></div>`;
}
function spCounts(P) {

/* ---------- 设置页里的一块（CX） ---------- */
function spSettingsHTML() {

/* ---------- 一个够用的 Markdown 渲染：标题、段落、列表（两层）、表格、代码块、行内代码、加粗 ---------- */
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c.replace(/\\\|/g, '|')); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${esc(codes[+i])}</code>`);
}
function mdHTML(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  // 表格里写成 \| 的竖线不算分隔（不用后行断言，旧版 Safari 也能跑）
  const cells = l => l.trim().replace(/\\\|/g, '\u0001').replace(/^\||\|$/g, '').split('|').map(c => c.trim().replace(/\u0001/g, '\\|'));
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out += `<pre class="g-code">${esc(buf.join('\n'))}</pre>`; continue;
    }
    const h = l.match(/^(#{1,4})\s+(.+)$/);
    if (h) { const n = Math.min(4, h[1].length + 1); out += `<h${n} class="g-h${h[1].length}">${mdInline(h[2])}</h${n}>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out += `<div class="g-tablewrap"><table class="g-table"><thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    const li = /^(\s*)(?:[-*]|\d+\.)\s+(.+)$/;
    if (li.test(l)) {
      const ordered = /^\s*\d+\./.test(l), tag = ordered ? 'ol' : 'ul';
      let html = '', open = false, sub = '';
      while (i < lines.length && (li.test(lines[i]) || (/^\s+\S/.test(lines[i]) && open))) {
        const m = lines[i].match(li);
        if (m && !m[1]) { if (open) html += (sub ? `<ul>${sub}</ul>` : '') + '</li>'; html += `<li>${mdInline(m[2])}`; open = true; sub = ''; }
        else if (m) sub += `<li>${mdInline(m[2])}</li>`;
        else html += ' ' + mdInline(lines[i].trim());
        i++;
      }
      if (open) html += (sub ? `<ul>${sub}</ul>` : '') + '</li>';
      out += `<${tag} class="g-list">${html}</${tag}>`; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||\s*(?:[-*]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++].trim());
    out += `<p>${mdInline(buf.join(' '))}</p>`;
  }
  return out;
}

/* ============================================================
   找回 v9 更新前的数据
   v9 改成从空白开始以前，导入的内容存在 ielts-writing-app.v2（和 v8 共用）。
   这里把其中自己导入的内容和学习进度复制到 v9；旧数据原样留着，v8 照常能用。
   ============================================================ */
const LEGACY_KEY = 'ielts-writing-app.v2';
const LEGACY_SAMPLE = '示例笔记，可删除';
// 以前 App 自带的功能和话题：导入的内容可能并进了它们，现在要给它们一个自己的组 / 话题
const LEGACY_FN = { 'fn-opinion': '表达观点', 'fn-main': '引出主要观点', 'fn-add': '补充信息', 'fn-contrast': '转折与对比', 'fn-concession': '让步', 'fn-cause': '原因与解释', 'fn-result': '结果与影响', 'fn-example': '举例与证据', 'fn-emphasis': '强调与限定', 'fn-sequence': '顺序与展开', 'fn-conclusion': '总结与结论' };
const LEGACY_TOPIC = {
  med: { name: '医疗科技与监管', theme: '科技', concepts: ['监管审批', '临床试验', '患者安全', '数据隐私', '医疗创新'], base: 4, st: { 支持: '新技术未经检验就使用，会威胁患者的安全和隐私', '反对 / 让步': '监管太严会拖慢创新，反而耽误需要治疗的人' } },
  online: { name: '线上学习的利与弊', theme: '教育', concepts: ['灵活安排', '学习资源', '自律', '社交互动'], base: 4, st: { 好处: '线上学习不受时间地点限制，资源也更丰富', 坏处: '没有老师和同学在身边，很多人难以坚持，也缺少交流' } },
};

// 可以找回的地方：v1–v8 和更新前的 v9 共用一个；测试台单独一个（测试台的演示内容和以前自带的一样，转换方法相同）
const LEGACY_SRC = [
  { key: LEGACY_KEY, name: 'v1–v8 和更新前的 v9' },
  { key: 'ielts-writing-test.v1', name: '测试台' },
];
function legacyRead(key = LEGACY_KEY) {
  if (window.__DEMO || window.__ARCHIVE) return null; // 测试台、旧版本预览里不做找回
  try { const r = JSON.parse(localStorage.getItem(key)); return r && r.v === 2 && r.notes ? r : null; } catch (e) { return null; }
}
/* 每个地方里自己导入的内容；没有内容的不列 */
function legacyFound() {
  return LEGACY_SRC.map(src => { const r = legacyRead(src.key); const c = r && legacyCounts(r); return c ? Object.assign({}, src, { c }) : null; }).filter(Boolean);
}
const legacyExtHas = e => (e.stances || []).some(s => (s.args || []).length) || (e.terms || []).length;
/* 旧数据里有多少自己导入的内容（不算自带的示例笔记） */
function legacyCounts(r) {
  if (!r) return null;
  const sample = new Set((r.notes.sets || []).filter(s => s.source === LEGACY_SAMPLE).map(s => s.id));
  const its = (r.notes.items || []).filter(i => !sample.has(i.setId));
  const imp = (r.t3 && r.t3.imp) || {};
  const own = new Set((imp.topics || []).map(t => t.id));
  const c = {
    topics: own.size + Object.keys(imp.ext || {}).filter(k => !own.has(k) && LEGACY_TOPIC[k] && legacyExtHas(imp.ext[k])).length,
    fn: its.filter(i => i.type === 'fn').length,
    notes: its.filter(i => i.type !== 'fn').length,
    imports: (r.imports || []).length,
  };
  c.total = c.topics + c.fn + c.notes;
  // 让人认得出是哪一份：几个名字 + 最近一次活动的日期
  c.allNames = [...new Set((imp.topics || []).map(t => t.name).concat((r.notes.groups || []).filter(g => !sample.has(g.setId) && its.some(i => i.gid === g.id)).map(g => LEGACY_FN[g.id] || g.name)).filter(Boolean))];
  c.names = c.allNames.slice(0, 4);
  const ts = (r.notes.sets || []).map(x => x.created).concat((r.imports || []).map(x => x.at), ((r.t3 && r.t3.combos) || []).map(x => x.created), Object.keys(r.log || {}).map(k => Date.parse(k))).filter(x => x > 0);
  c.last = ts.length ? Math.max(...ts) : 0;
  return c.total ? c : null;
}
const legacyLine = c => [c.topics && `${c.topics} 个话题`, c.fn && `${c.fn} 条功能表达`, c.notes && `${c.notes} 张笔记卡`].filter(Boolean).join('、');

/* 把旧数据变成 v9 能用的样子 */
function legacyConvert(r) {
  const S2 = JSON.parse(JSON.stringify(r));
  const N = S2.notes;
  N.sets = N.sets || []; N.groups = N.groups || []; N.items = N.items || [];
  // 1. 去掉以前自带的示例笔记
  const sample = new Set(N.sets.filter(s => s.source === LEGACY_SAMPLE).map(s => s.id));
  N.sets = N.sets.filter(s => !sample.has(s.id));
  N.groups = N.groups.filter(g => !sample.has(g.setId));
  N.items = N.items.filter(i => !sample.has(i.setId));
  // 2. 并进自带功能的功能表达：建一个同名的功能组，组 id 不变，进度不丢
  const gids = new Set(N.groups.map(g => g.id));
  for (const it of N.items) if (it.type === 'fn' && !gids.has(it.gid) && LEGACY_FN[it.gid]) {
    N.groups.push({ id: it.gid, setId: it.setId, kind: 'fn', name: LEGACY_FN[it.gid] }); gids.add(it.gid);
  }
  // 3. 补进自带话题的论点：变成自己的话题（id 不变），论点从 1 开始编号，进度跟着改过去
  const t3 = S2.t3;
  if (t3 && t3.imp) {
    t3.imp.topics = t3.imp.topics || []; t3.imp.ext = t3.imp.ext || {};
    const own = new Set(t3.imp.topics.map(t => t.id));
    for (const [tid, ext] of Object.entries(t3.imp.ext)) {
      const B = LEGACY_TOPIC[tid];
      if (own.has(tid) || !B) continue;
      delete t3.imp.ext[tid];
      if (!legacyExtHas(ext)) continue;
      const stances = [], orig = [];
      (ext.stances || []).forEach(es => {
        let s = stances.find(x => x.name === es.name);
        if (!s) stances.push(s = { name: es.name, idea: es.idea || B.st[es.name] || '', args: [] });
        (es.args || []).forEach(a => { s.args.push(a); orig.push(a); });
      });
      const newN = new Map(); let n = 0;
      stances.forEach(s => s.args.forEach(a => newN.set(a, ++n)));
      const ren = {};
      orig.forEach((a, k) => { ren[`a:${tid}:${B.base + k + 1}`] = `a:${tid}:${newN.get(a)}`; });
      t3.imp.topics.push({ id: tid, theme: B.theme, name: B.name, concepts: B.concepts.slice(), stances, terms: ext.terms || [] });
      legacyRename(S2, tid, ren);
    }
  }
  S2.seeded = true;
  if (S2.user && S2.user.name === 'Emily') S2.user.name = ''; // 以前的默认名字
  S2.legacy = 'done';
  S2.needPrune = true;
  return S2;
}
/* 论点改了编号：所有用论点 id 记的东西都跟着改；原来自带的论点直接去掉 */
function legacyRename(S2, tid, ren) {
  const rk = k => {
    const m = String(k).match(/^(a:([^:]+):\d+)(.*)$/);
    if (!m || m[2] !== tid) return k;
    return ren[m[1]] ? ren[m[1]] + m[3] : null;
  };
  const remap = o => { if (!o) return o; const out = {}; for (const [k, v] of Object.entries(o)) { const nk = rk(k); if (nk) out[nk] = v; } return out; };
  const t3 = S2.t3;
  ['arg', 'it', 'fav', 'over'].forEach(f => { t3[f] = remap(t3[f]); });
  t3.combos = (t3.combos || []).map(c => c.topic !== tid ? c : Object.assign(c, { args: (c.args || []).map(rk).filter(Boolean) })).filter(c => c.topic !== tid || c.args.length);
  if (t3.learn && t3.learn.topic === tid) t3.learn = null;
  t3.rev = null;
  (S2.imports || []).forEach(rec => { rec.ids = (rec.ids || []).map(rk).filter(Boolean); });
}
/* 找回以后第一次打开：去掉指向已经不存在的内容的记录 */
function legacyPrune() {
  if (!S.needPrune) return;
  delete S.needPrune;
  const keep = (o, has) => { for (const k of Object.keys(o || {})) if (!has(k)) delete o[k]; };
  keep(S.items, k => ITEMS.has(k));
  const t3 = S.t3;
  keep(t3.arg, k => T.arg.has(k)); keep(t3.it, k => T.item.has(k)); keep(t3.term, k => T.term.has(k));
  keep(t3.fav, k => T.arg.has(k) || T.item.has(k) || T.term.has(k) || ITEMS.has(k));
  t3.combos = (t3.combos || []).filter(c => T.topic.has(c.topic)).map(c => Object.assign(c, { args: (c.args || []).filter(id => T.arg.has(id)) })).filter(c => c.args.length);
  if (t3.learn && !T.topic.has(t3.learn.topic)) t3.learn = null;
  if (t3.rev && !(t3.rev.queue || []).every(q => T.arg.has(q.id) || T.item.has(q.id) || T.term.has(q.id))) t3.rev = null;
  t3.revDone = null; t3.sprintPlan = null; t3.impDraft = null; t3.impFlow = null;
  if (S.side) { S.side.today = { day: '', list: null, cat: null, custom: false, done: false }; S.side.learn = null; S.side.rev = null; S.side.revDone = null; }
  if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
  if (S.reviewSession && !GROUPS.has(S.reviewSession.gid)) S.reviewSession = null;
  save();
}

function storeDetail(r) {

  const its = (r.notes.items || []).filter(i => !sample.has(i.setId));

    .concat(Object.entries(imp.ext || {}).filter(([k, e]) => LEGACY_TOPIC[k] && legacyExtHas(e)).map(([k, e]) => `${LEGACY_TOPIC[k].name}（补充了 ${nArgs(e)} 个论点）`));
  const byGroup = kindFn => {

    return [...m].map(([n, c]) => `${n}（${c}）`);

  const fns = byGroup(t => t === 'fn'), notes = byGroup(t => t !== 'fn');

   ============================================================ */
function setSessionFb(input, revealed) {
  const r = cur();
  if (r.v === 'learn') {
    const ns = S.newSession;
    const id = ns.step === 'apply' ? ns.apply[ns.ai] : ns.queue[0];
    const it = ITEMS.get(id);
    ns.fb = { input, revealed };
    if (ns.step === 'write' && ns.first[id] === undefined) ns.first[id] = !revealed && diff(input, answerOf(it)).ok;
    save();
  } else if (r.v === 'review') {
    S.reviewSession.fb = { input, revealed }; save();
  } else if (r.v === 'practice') {
    ui.practice.fb = { input, revealed };
  }
  render();
}
function continueLearn() {
  const ns = S.newSession;
  if (ns.step === 'apply') {
    ns.ai++; ns.fb = null;
    if (ns.ai >= ns.apply.length) endRound();
  } else {
    const id = ns.queue[0], it = ITEMS.get(id), fb = ns.fb;
    const ok = fb && !fb.revealed && diff(fb.input, answerOf(it)).ok;
    ns.fb = null;
    if (ok) { markLearned(id, !!ns.first[id]); ns.queue.shift(); }
    else { ns.again[id] = true; ns.queue.push(ns.queue.shift()); }
    if (!ns.queue.length) {
      ns.apply = pickApply(ns.rounds[ns.round]); ns.ai = 0;
      if (ns.apply.length) ns.step = 'apply'; else endRound();
    }
  }
  if (S.newSession) save();
  render(true);
}
function endRound() {
  const ns = S.newSession;
  if (ns.round + 1 < ns.rounds.length) ns.step = 'rounddone';
  else finishNew();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-go],[data-nav]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm && !el.classList.contains('armed')) {
    el.classList.add('armed');
    el.dataset.label = el.textContent;
    el.textContent = el.dataset.confirm;
    setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = el.dataset.label; } }, 3500);
    return;
  }
  if (el.dataset.nav) {
    const v = el.dataset.nav;
    if (v === 'today') { ui.todaySel = ui.todaySel || null; }
    goRoot({ v }); return;
  }
  if (el.dataset.go) { go(parseRoute(el.dataset.go)); return; }
  const a = el.dataset.a, id = el.dataset.id;
  if (a && a.startsWith('t3') && t3click(a, el)) return;
  if (a && a.startsWith('d') && detailClick(a, el)) return;
  if (a && (a.startsWith('imp') || a === 'tunrec') && (importClick(a, el) || flowClick(a, el) || histClick(a, el))) return;
  if (a && a.startsWith('iedit') && editClick(a, el)) return;
  if (a && a.startsWith('sd') && sideClick(a, el)) return;
  if (a && a.startsWith('sp') && spClick(a, el)) return;
  if (a && (a.startsWith('tpl') || a.startsWith('dat')) && guideClick(a, el)) return;
  switch (a) {
    case 'back': back(); break;
    case 'hidehint': S.user.hintClosed = true; save(); render(); break;
    case 'mode': {
      S.items[id] = S.items[id] || { hist: [], wrong: 0 };
      S.items[id].mode = el.dataset.m; save(); render();
      break;
    }
    case 'fav': { const s = st(id); s.fav = !s.fav; save(); render(); toast(s.fav ? '已收藏' : '已取消收藏'); break; }
    case 'mem': { st(id).mode = modeOf(id) === 'memory' ? 'reference' : 'memory'; save(); render(); break; }
    case 'cat': ui.todayCat = el.dataset.c; ui.todayOld = false; render(); break;
    case 'pick': ui.todaySel = id; ui.todayOpen.add(id); render(); break;
    case 'expand': ui.todayOpen.has(id) ? ui.todayOpen.delete(id) : ui.todayOpen.add(id); render(); break;
    case 'startnew': if (ui.todaySel) startNew(ui.todaySel); break;
    case 'resumenew': go({ v: 'learn' }); break;
    case 'dropnew': S.newSession = null; save(); render(); toast('已放弃本次新学进度，已完成的条目保留'); break;
    case 'beginwrite': { const ns = S.newSession; ns.step = 'write'; ns.queue = ns.rounds[ns.round].filter(x => !studied(x)); ns.fb = null; if (!ns.queue.length) endRound(); if (S.newSession) save(); render(true); break; }
    case 'nextround': { const ns = S.newSession; ns.round++; ns.step = 'intro'; ns.fb = null; save(); render(true); break; }
    case 'reveal': setSessionFb('', true); break;
    case 'cont': {
      const r = cur();
      if (r.v === 'learn') continueLearn();
      else if (r.v === 'practice') { const p = ui.practice; p.i++; p.fb = null; if (p.i >= p.ids.length) { ui.lastReview.practiced = true; back(); toast('错题练习完成'); } else render(true); }
      break;
    }
    case 'donenew': ui.lastNew = null; back(); break;
    case 'startreview': startReview(); break;
    case 'startreview-replace': ui.lastNew = null; startReview(null, true); break;
    case 'reviewgroup': startReview(id); break;
    case 'resumereview': go({ v: 'review' }); break;
    case 'rate': {
      const rs = S.reviewSession, iid = rs.ids[rs.i];
      applyRating(iid, el.dataset.r, ITEMS.get(iid).type);
      if (el.dataset.r !== 'rem' && rs.fb && rs.fb.input && !rs.fb.revealed) { const w = st(iid); (w.wrongs = w.wrongs || []).push({ t: Date.now(), input: rs.fb.input, r: el.dataset.r }); if (w.wrongs.length > 20) w.wrongs.shift(); }
      rs.ratings[iid] = el.dataset.r; rs.i++; rs.fb = null;
      if (rs.i >= rs.ids.length) finishReview(); else save();
      render(true);
      break;
    }
    case 'practice': {
      const r = ui.lastReview;
      ui.practice = { ids: r.ids.filter(x => r.ratings[x] !== 'rem' && ITEMS.has(x)), i: 0, fb: null };
      go({ v: 'practice' }); break;
    }
    case 'donereview': ui.lastReview = null; back(); break;
    case 'checkin': checkin(); render(); break;
    case 'checkin-back': checkin(); ui.lastNew = null; ui.lastReview = null; back(); break;
    case 'exit': back(); toast('已保存进度，可以从首页继续'); break;
    case 'quick-replace': ui.lastNew = null; replaceRoute({ v: 'quick', id }); break;
    case 'qrmode': ui.qrMode = el.dataset.m; ui.qrShown = new Set(); render(); break;
    case 'qr': if (el.classList.contains('masked')) { ui.qrShown.add(el.dataset.k); el.classList.remove('masked'); } break;
    case 'qrreset': ui.qrShown = new Set(); render(); break;
    case 'nextitem': replaceRoute({ v: 'item', id }); break;
    case 'nfilter': ui.notesFilter = el.dataset.f; render(); break;
    case 'calprev': case 'calnext': { let [y, m] = ui.calMonth; m += a === 'calprev' ? -1 : 1; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.calMonth = [y, m]; render(); break; }
    case 'seg': {
      const seg = el.closest('[data-seg]');
      seg.dataset.value = el.dataset.v;
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      if (seg.dataset.seg === 'type') seg.closest('form').querySelectorAll('[data-for]').forEach(f => { f.hidden = !f.dataset.for.split(' ').includes(el.dataset.v); });
      break;
    }
    case 'sample': { const ta = $('#import-text'); ta.value = SAMPLE_NOTE; $('[data-form="import"] [name="title"]').value = dayKey() + ' 示例笔记'; break; }
    case 'ttype': {
      const it = S.notes.items.find(x => x.id === id);
      if (it && it.type !== el.dataset.t) {
        it.type = el.dataset.t;
        const gid = 'ng:' + uid();
        S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: it.en });
        it.gid = gid; pruneNoteGroups(); assemble(); save(); render();
      }
      break;
    }
    case 'trowmore': {
      ui.trowOpen.has(id) ? ui.trowOpen.delete(id) : ui.trowOpen.add(id);
      const m = el.closest('.trow-wrap').querySelector('.trow-more');
      m.hidden = !ui.trowOpen.has(id); el.setAttribute('aria-expanded', String(!m.hidden));
      break;
    }
    case 'tdel': S.notes.items = S.notes.items.filter(x => x.id !== id); delete S.items[id]; pruneNoteGroups(); assemble(); save(); render(); break;
    case 'tconfirm': {
      const set = noteSet(id); if ((set.unrec || []).length) break; set.confirmed = true;
      S.notes.items.filter(x => x.setId === id).forEach(x => { if (!(S.items[x.id] && S.items[x.id].mode)) st(x.id).mode = defMode(x); });
      assemble(); save(); toast('已确认导入');
      const rec = recFinishNotes(id); save(); replaceRoute({ v: 'impdone', id: rec.id });
      break;
    }
    case 'tdiscard': case 'delset': {
      if (a === 'tdiscard') { (S.imports || []).forEach(x => { x.setIds = recSets(x).filter(s => s !== id); }); S.imports = (S.imports || []).filter(x => recSets(x).length || (x.tids || []).length); }
      const gone = new Set(S.notes.items.filter(x => x.setId === id).map(x => x.id));
      S.notes.items = S.notes.items.filter(x => x.setId !== id);
      S.notes.groups = S.notes.groups.filter(g => g.setId !== id);
      S.notes.sets = S.notes.sets.filter(s => s.id !== id);
      gone.forEach(x => delete S.items[x]);
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      assemble();
      if (S.newSession && !GROUPS.has(S.newSession.gid)) S.newSession = null;
      if (S.reviewSession && !GROUPS.has(S.reviewSession.gid)) S.reviewSession = null;
      save();
      toast(a === 'tdiscard' ? '已放弃这次导入' : '已删除笔记组');
      if (a === 'tdiscard') replaceRoute({ v: 'notes' }); else render();
      break;
    }
    case 'delitem': {
      const it = ITEMS.get(id);
      if (it.setId) { S.notes.items = S.notes.items.filter(x => x.id !== id); pruneNoteGroups(); }
      else { S.custom.items = S.custom.items.filter(x => x.id !== id); const used = new Set(S.custom.items.map(x => x.gid)); S.custom.groups = S.custom.groups.filter(g => used.has(g.id)); }
      delete S.items[id];
      assemble();
      if (S.newSession) { S.newSession.ids = S.newSession.ids.filter(x => x !== id); if (!S.newSession.ids.length) S.newSession = null; }
      save(); toast('已删除'); back();
      break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.form;
  if (kind && kind.startsWith('t3')) { t3submit(kind, f); return; }
  if (kind === 'iedit') { editSubmit(f); return; }
  if (kind === 'sans') { sdSubmit(f); return; }
  if (kind === 'answer') {
    const inp = f.querySelector('.answer');
    if (inp.readOnly) return;
    setSessionFb(inp.value, false);
  } else if (kind === 'drill') {
    const it = ITEMS.get(f.dataset.id);
    const d = diff($('#drill-in').value, answerOf(it));
    $('#drill-fb').innerHTML = fbHTML(d, it, d.empty);
  } else if (kind === 'add') {
    const G = GROUPS.get(f.dataset.id);
    const v = n => (f.querySelector(`[name="${n}"]`) || { value: '' }).value.trim();
    const seg = n => { const s = f.querySelector(`[data-seg="${n}"]`); return s ? s.dataset.value : ''; };
    const en = v('en'), zh = v('zh');
    if (!en || !zh) { $('#form-msg').textContent = '请填写英文表达和中文含义。'; return; }
    if (/[㐀-鿿]/.test(en)) { $('#form-msg').textContent = '英文表达里不要包含中文。'; return; }
    const id = (G.lib === 'notes' ? 'n:' : 'c:') + uid();
    let type = G.lib === 'function' ? 'fn' : seg('type');
    let gid = G.id;
    const solo = seg('target') === 'solo' || (G.lib === 'notes' && type !== G.kind);
    if (G.lib === 'notes') {
      if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
      if (solo) { gid = 'ng:' + uid(); S.notes.groups.push({ id: gid, setId: G.setId, kind: type, name: en }); }
      const rec = { id, setId: G.setId, gid, type, raw: '', line: 0, defMode: seg('mode') };
      for (const [k] of NOTE_FORM) rec[k] = v(k);
      S.notes.items.push(rec);
    } else {
      if (solo) {
        gid = 'cg:' + uid();
        S.custom.groups.push(G.lib === 'topic'
          ? { id: gid, lib: 'topic', topic: G.topic, sub: G.sub, name: en, scene: zh, independent: true, parent: G.id }
          : { id: gid, lib: 'function', fn: G.fn, name: en, scene: G.scene, independent: true, parent: G.id });
      }
      S.custom.items.push({ id, lib: G.lib, type, gid, en, zh, ex: v('ex'), col: '', usage: '', err: '', syntax: v('syntax'), tone: v('tone'), diff: v('diff'), defMode: seg('mode') });
    }
    st(id).mode = seg('mode');
    assemble(); save(); back(); toast(solo ? '已作为独立项保存' : '已加入「' + G.name + '」');
  } else if (kind === 'edit') {
    const it = S.notes.items.find(x => x.id === f.dataset.id);
    const v = n => f.querySelector(`[name="${n}"]`).value.trim();
    const type = f.querySelector('[data-seg="type"]').dataset.value;
    if (!v('en')) { $('#form-msg').textContent = '英文表达不能为空。'; return; }
    if (type === 'grammar' && !v('wrong')) { $('#form-msg').textContent = '语法卡需要填写原来的错误写法。'; return; }
    for (const [k] of NOTE_FORM) it[k] = v(k);
    if (type !== it.type) {
      it.type = type;
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: type, name: it.en });
      it.gid = gid; pruneNoteGroups();
    }
    assemble(); save(); back(); toast('已保存修改');
  } else if (kind === 'import') {
    const text = f.querySelector('[name="text"]').value;
    const title = f.querySelector('[name="title"]').value.trim() || dayKey() + ' 写作笔记';
    if (!text.trim()) { $('#form-msg').textContent = '请先粘贴笔记内容或导入 Markdown 文件。'; return; }
    const ok = runImport(text, title, importSource || '粘贴的文字');
    importSource = '';
    ui.impText = ''; ui.impTitle = '';
    if (!ok) { const dup = [runImport.sameTopics ? `${runImport.sameTopics} 个话题` : '', createNoteSet.skipped ? `${createNoteSet.skipped} 条笔记 / 功能表达` : ''].filter(Boolean).join('、'); $('#form-msg').innerHTML = dup ? `这些内容（${dup}）都已经导入过了，没有新内容。` : '没有识别到内容。每行写一条，英文在前、中文在后；主题表达用“# 话题：……”开头。<button class="t-link-btn" type="button" data-go="impguide">看导入格式说明 ›</button>'; return; }
  }
});

let importSource = '';
document.addEventListener('change', e => {
  const t = e.target;
  if (t3change(t)) return;
  if (guideChange(t)) return;
  if (t.id === 'md-file' && t.files && t.files[0]) {
    const file = t.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      $('#import-text').value = String(reader.result || '');
      const title = $('[data-form="import"] [name="title"]');
      title.value = file.name.replace(/\.(md|markdown|txt)$/i, '') || title.value;
      importSource = 'Markdown 文件 · ' + file.name;
      toast('已读取 ' + file.name);
    };
    reader.onerror = () => toast('文件读取失败，请改为粘贴文字');
    reader.readAsText(file);
  }
  if (t.dataset.ttype) {
    const it = S.notes.items.find(x => x.id === t.dataset.ttype);
    if (it && it.type !== t.value) {
      it.type = t.value;
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: it.en });
      it.gid = gid; pruneNoteGroups(); assemble(); save(); render();
    }
  }
  if (t.dataset.gmode && t.value) {
    t.dataset.gmode.split(' ').forEach(id => { st(id).mode = t.value; });
    save(); render(); toast('这一组已全部设为' + { memory: '记忆', reference: '资料', paused: '暂缓' }[t.value]);
  }
  if (t.dataset.tmove) {
    const it = S.notes.items.find(x => x.id === t.dataset.tmove);
    if (t.value === 'solo' || t.value === 'new') {
      const gid = 'ng:' + uid();
      S.notes.groups.push({ id: gid, setId: it.setId, kind: it.type, name: t.value === 'new' ? '新的语义组' : it.en });
      it.gid = gid;
      if (t.value === 'new') toast('已新建语义组，再把相近的卡片移进来');
    } else it.gid = t.value;
    pruneNoteGroups(); assemble(); save(); render();
  }
});

let noteTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (recInput(t)) return;
  if (t.id === 'q') {
    const q = t.value;
    if (!q.trim()) { if (cur().v === 'search') back(); return; }
    if (cur().v === 'search') { cur().id = q; render(); } else go({ v: 'search', id: q });
    t.focus();
    return;
  }
  if (t.dataset.note) {
    const id = t.dataset.note;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { st(id).note = t.value; save(); }, 300);
  }
  if (t.dataset.tf) {
    const it = S.notes.items.find(x => x.id === t.dataset.id);
    if (it) { it[t.dataset.tf] = t.value; save(); assemble(); }
    if (it && t.dataset.tf === 'zh' && it.type !== 'grammar') t.closest('.trow')?.classList.toggle('warn', !t.value.trim());
  }
  if (t.dataset.gname) {
    const g = S.notes.groups.find(x => x.id === t.dataset.gname);
    if (g) { g.name = t.value; save(); assemble(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.matches('textarea') || (t.matches('input') && !t.readOnly)) return;
  if (t.matches('button') && !t.hasAttribute('data-enter')) return;
  const b = $('#view [data-enter]');
  if (b) { e.preventDefault(); b.click(); }
});

/* ============================================================
   启动
   ============================================================ */
function fillSampleDetails() {
  const detail = new Map();
  for (const sec of parseNotes(SAMPLE_NOTE)) for (const c of sec.cards) detail.set(c.en.toLowerCase(), c);
  let changed = false;
  for (const it of S.notes.items) {
    const set = noteSet(it.setId);
    if (!set || !/示例/.test(set.source || '')) continue;
    const c = detail.get(it.en.toLowerCase());
    if (!c || !c.fields) continue;
    const f = Object.assign({}, c.fields);
    if (it.type === 'pattern' && f.usage && !f.scene) { f.scene = f.usage; delete f.usage; }
    for (const [k, v] of Object.entries(f)) if (!it[k]) { it[k] = v; changed = true; }
  }
  if (changed) save();
}
if (!S.seeded) {
  if (window.__DEMO) createNoteSet(SAMPLE_NOTE, '示例 · 2026-10-06 写作笔记', { confirmed: true, source: '示例笔记，可删除' });
  S.seeded = true;
  save();
}
fillSampleDetails();
assemble();
t3init();
t3assemble();
legacyPrune();
safetyStartup();
// 测试台（test.html）用：正式版不设 __TEST__，这里不会执行
if (window.__TEST__) window.__app = { S: () => S, items: () => ITEMS, assemble, createNoteSet, t3assemble, samples: () => [SAMPLE_NOTE, SAMPLE_FN, SAMPLE_TOPIC], save, render, go, goRoot, cur, ui, T, AR, IR, TR, t3plan, t3StartRev, dayStart, addDays, dayKey, fmtMD, STAGE_LABEL, RL3, TIER_LABEL, tierOf, ctxAnswer: () => { try { const c = t3ctx(); return c ? c.ans : null; } catch (e) { return null; } } };
const startHash = (location.hash || '').slice(1);
if (VIEWS[startHash] && ['home', 'today', 'topics', 'funcs', 'notes', 'favs', 'records', 'library', 'tsettings', 'imphist'].includes(startHash)) stack = [{ v: startHash }];
render(true);
try { if (sessionStorage.getItem('__legacyok')) { sessionStorage.removeItem('__legacyok'); toast('已找回更新前的内容和学习进度'); } } catch (e) {}
try { if (sessionStorage.getItem('__snapok')) { sessionStorage.removeItem('__snapok'); toast('已恢复这一份自动备份'); } } catch (e) {}
})();
</script>
